<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,#4a4136,#2f2a22 70%,#211d18);
    color:#3a3129;user-select:none;touch-action:manipulation;
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---------------- header ---------------- */
  header{width:100%;max-width:900px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px;
    text-align:center;flex:0 0 auto;z-index:10}
  h1{margin:0;font-size:1.22rem;letter-spacing:.5px;color:#ffeccd;
    text-shadow:0 1px 3px rgba(0,0,0,.45)}
  .status{margin:2px 0 0;font-size:.82rem;min-height:1.15em;color:#f0dfc4;opacity:.92}

  .meters{display:flex;justify-content:center;margin-top:7px}
  .meter + .meter{margin-left:6px}
  .meter{flex:1;max-width:130px;background:rgba(0,0,0,.28);border-radius:99px;
    padding:3px 7px 3px 5px;display:flex;align-items:center;gap:5px}
  .meter.life{max-width:290px;padding:5px 12px 5px 9px;gap:8px}
  .meter.life span{font-size:1.05rem}
  .meter.life .bar{height:11px}
  .meter.life b{font-size:.76rem;min-width:2.4em;text-align:right;color:#f4e7d2;opacity:.9}
  .meter.life.fading{animation:heartbeat 1.4s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .meter span{font-size:.8rem;line-height:1}
  .bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar i{display:block;height:100%;width:80%;border-radius:99px;transition:width .5s ease,background .5s}
  .bar.food i{background:linear-gradient(90deg,#9ad155,#6fae3c)}
  .bar.water i{background:linear-gradient(90deg,#7fd4ef,#3fa8d8)}
  .bar.love i{background:linear-gradient(90deg,#ff9fc0,#f2678f)}
  .bar.clean i{background:linear-gradient(90deg,#d8cba8,#b2a17a)}
  .bar i.low{background:linear-gradient(90deg,#ffb36b,#e8663c)!important}

  /* ---------------- the box ---------------- */
  .boxwrap{flex:1 1 auto;width:100%;max-width:860px;padding:8px 10px 0;
    display:flex;align-items:stretch;justify-content:center;min-height:0}
  .box{position:relative;flex:1;border-radius:18px;overflow:hidden;
    background:linear-gradient(#5f9152,#4e7c45 42%,#436c3c);
    box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 0 0 3px #35592f;
  }
  /* soft sheen down the green walls */
  .box::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.5;
    background:
      linear-gradient(103deg,rgba(255,255,255,.16) 0 12%,rgba(255,255,255,0) 34%),
      repeating-linear-gradient(91deg,rgba(0,0,0,.05) 0 1px,transparent 1px 9px)}
  /* rolled top edge of the box */
  .rim{position:absolute;left:0;right:0;top:0;height:9%;pointer-events:none;
    background:linear-gradient(#7cae69,#5c8d51);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.2)}
  .rim::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0))}

  .floor{position:absolute;left:5%;right:5%;top:9%;bottom:3%;
    -webkit-clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);
    clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);
    overflow:hidden;
    background-color:#5b8c50;
    background-image:
      radial-gradient(120% 90% at 50% 8%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),
      repeating-linear-gradient(96deg,rgba(255,255,255,.032) 0 2px,rgba(0,0,0,0) 2px 11px),
      repeating-linear-gradient(9deg,rgba(0,0,0,.022) 0 3px,rgba(0,0,0,0) 3px 17px)}
  /* inner wall shadow, so it reads as a box you look into */
  .floor::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:900;
    box-shadow:inset 0 22px 32px -12px rgba(18,42,16,.6),
               inset 26px 0 26px -18px rgba(18,42,16,.45),
               inset -26px 0 26px -18px rgba(18,42,16,.45)}

  /* ---------------- props ---------------- */
  /* after dark the box cools down, with a warm glow from the room */
  .box.night{filter:brightness(.84) saturate(.92)}
  .box.night::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:950;
    background:
      radial-gradient(55% 34% at 84% 3%,rgba(255,214,140,.20),rgba(0,0,0,0) 70%),
      linear-gradient(rgba(22,32,62,.16),rgba(22,32,62,.26))}

  /* a torn scrap of newsprint with one letter on it, lying near the front of
     the box: closest to the reader, clear of the piggies' favourite spots, and
     a high z-index because anything at the front is drawn over what is behind */
  .letter{position:absolute;right:5.5%;bottom:4%;z-index:820;width:96px;
    border:0;padding:9px 6px 10px;cursor:pointer;text-align:center;
    background:#ece5d6;color:#3f3b33;font:inherit;line-height:1;
    transform:rotate(3deg);
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.34));
    -webkit-clip-path:polygon(3% 4%,40% 0,76% 5%,100% 2%,97% 36%,100% 70%,95% 97%,
                      60% 100%,24% 95%,4% 99%,0 64%,3% 31%);
    clip-path:polygon(3% 4%,40% 0,76% 5%,100% 2%,97% 36%,100% 70%,95% 97%,
                      60% 100%,24% 95%,4% 99%,0 64%,3% 31%);
    display:flex;flex-direction:column;align-items:center;
    background-image:repeating-linear-gradient(rgba(120,114,104,.11) 0 1px,transparent 1px 5px)}
  .letter > * + *{margin-top:5px}
  .letter:active{transform:rotate(3deg) scale(.95)}
  .letter .l-big{font-size:2.5rem;font-weight:800;letter-spacing:1px}
  .letter .l-kn{font-size:1.15rem;
    font-family:"Noto Sans Kannada","Kannada Sangam MN","Tunga",serif}
  .letter .l-word{font-size:.5rem;font-weight:700;opacity:.7;line-height:1.2;
    font-family:"Noto Sans Kannada","Kannada Sangam MN","Tunga",sans-serif}
  .letter .l-word b{color:#c2503c;font-size:1.35em;font-weight:800;opacity:1}
  .letter.flip{animation:cardflip .45s ease}
  @keyframes cardflip{0%{transform:rotate(3deg) rotateY(0)}
    50%{transform:rotate(3deg) rotateY(74deg) scale(.94)}
    100%{transform:rotate(3deg) rotateY(0)}}
  @media (min-width:700px){
    .letter{width:138px;padding:14px 10px 16px}
    .letter > * + *{margin-top:8px}
    .letter .l-big{font-size:3.6rem}
    .letter .l-kn{font-size:1.7rem}
    .letter .l-word{font-size:.72rem}
  }

  /* the bonus quiz, on a slip of the same paper */
  .quiz{position:fixed;top:0;right:0;bottom:0;left:0;z-index:130;display:none;
    align-items:center;justify-content:center;padding:20px;background:rgba(20,16,12,.6)}
  .quiz.show{display:flex}
  .quiz .slip{position:relative;width:100%;max-width:330px;background:#ece5d6;color:#3f3b33;
    padding:20px 18px 16px;text-align:center;transform:rotate(-1.2deg);
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));
    -webkit-clip-path:polygon(1% 2%,34% 0,68% 3%,100% 1%,98% 30%,100% 62%,97% 98%,
                      64% 100%,30% 97%,2% 99%,0 60%,2% 28%);
    clip-path:polygon(1% 2%,34% 0,68% 3%,100% 1%,98% 30%,100% 62%,97% 98%,
                      64% 100%,30% 97%,2% 99%,0 60%,2% 28%);
    background-image:repeating-linear-gradient(rgba(120,114,104,.10) 0 1px,transparent 1px 5px)}
  .quiz .qtag{font-size:.58rem;font-weight:800;letter-spacing:1px;opacity:.5;text-transform:uppercase}
  .quiz .qask-kn{margin:4px 0 1px;font-size:1.02rem;font-weight:700;line-height:1.35;
    font-family:"Noto Sans Kannada","Kannada Sangam MN","Tunga",serif}
  .quiz .qask{margin:0 0 4px;font-size:.7rem;font-weight:700;opacity:.55}
  .quiz .qprize .kn{font-family:"Noto Sans Kannada","Kannada Sangam MN","Tunga",sans-serif;
    font-size:1.05em}
  .quiz .qbig{font-size:3.1rem;font-weight:800;line-height:1.05;letter-spacing:1px}
  .quiz .qopts{display:flex;flex-direction:column;margin-top:12px}
  .quiz .qopt + .qopt{margin-top:8px}
  .quiz .qopt{border:0;border-radius:12px;padding:12px 10px;font:inherit;font-size:1.15rem;
    font-weight:700;background:#fffaf0;color:#3f3b33;box-shadow:0 3px 0 rgba(0,0,0,.18);
    font-family:"Noto Sans Kannada","Kannada Sangam MN","Tunga",serif}
  .quiz .qopt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .quiz .qopt.wrong{animation:nope .4s ease}
  .quiz .qopt.right{background:#bfe6a0}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  .quiz .qskip{position:absolute;top:6px;right:10px;border:0;background:none;
    font:inherit;font-size:1rem;color:#3f3b33;opacity:.45;padding:4px 6px}
  .quiz .qprize{margin-top:10px;font-size:.66rem;font-weight:700;opacity:.6}
  @media (min-width:700px){
    .quiz .slip{max-width:420px;padding:26px 24px 20px}
    .quiz .qbig{font-size:4rem}
    .quiz .qask-kn{font-size:1.3rem}
    .quiz .qask{font-size:.85rem}
    .quiz .qopt{font-size:1.4rem;padding:15px}
  }

  .prop,.crumb{position:absolute;left:0;bottom:0}
  .prop{transform-origin:50% 100%}
  .bottle{cursor:pointer;pointer-events:auto}
  .wallbottle{position:absolute;right:9%;top:1.5%;width:74px;z-index:940;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
  .wallbottle svg{width:100%;height:auto;display:block}
  .bottle .glow{position:absolute;inset:-10px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);
    opacity:0;transition:opacity .3s}
  .bottle.thirsty .glow{opacity:1;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.25}50%{transform:scale(1.1);opacity:.7}}

  .crumb{transform-origin:50% 100%;pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.28));animation:plop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes plop{0%{transform:var(--t) translateY(-90px) rotate(-30deg) scale(.7)}
                  100%{transform:var(--t)}}
  .poop{position:absolute;width:7px;height:4.5px;border-radius:50%;
    background:#5d4a33;opacity:.8;pointer-events:none}
  .poop.mess{left:0;bottom:0}
  .grubby .floor{filter:saturate(.86) brightness(.95)}

  /* ---------------- the guinea pigs ---------------- */
  .pig{position:absolute;left:0;bottom:0;width:150px;transform-origin:50% 92%;
    will-change:transform;cursor:pointer}
  .pig .shadow{position:absolute;left:50%;bottom:7%;width:66%;height:11px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(50,35,15,.42),rgba(50,35,15,0))}
  .hop{transform-origin:50% 100%}
  .flip{transform-origin:50% 100%}
  .flip.left{transform:scaleX(-1)}
  .psvg{width:100%;height:auto;display:block;overflow:visible}

  .bodyg,.headg,.ear,.lid,.nose,.foot,.tuft{transform-box:fill-box}
  .bodyg{transform-origin:50% 100%;transition:transform .45s ease}
  .headg{transform-origin:22% 70%;transition:transform .4s ease}
  .ear{transform-origin:60% 100%}
  .lid{transform-origin:50% 0%;transform:scaleY(0)}
  .foot{transform-origin:50% 20%}

  /* breathing, always on */
  .pig .bodyg{animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{scale:1 1;rotate:0deg}50%{scale:1.014 .986;rotate:.7deg}}

  /* waddling walk */
  .walking .hop{animation:waddle .34s ease-in-out infinite}
  @keyframes waddle{0%,100%{transform:rotate(-2.2deg) translateY(0)}
                    50%{transform:rotate(2.2deg) translateY(-2px)}}
  .walking .foot.f{animation:step .34s ease-in-out infinite}
  .walking .foot.b{animation:step .34s ease-in-out infinite;animation-delay:-.17s}
  @keyframes step{0%,100%{transform:translateX(-1.5px) rotate(-8deg)}
                  50%{transform:translateX(1.5px) rotate(8deg)}}

  /* chewing */
  .eating .headg,.nibbling .headg{transform:rotate(9deg) translateY(3px)}
  .eating .jaw,.nibbling .jaw{animation:chew .22s ease-in-out infinite}
  @keyframes chew{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}

  /* drinking: rear up at the bottle */
  .drinking .bodyg{transform:rotate(-19deg) translateY(-6px)}
  .drinking .headg{transform:rotate(-12deg)}
  .drinking .tongue{animation:lick .3s ease-in-out infinite}
  @keyframes lick{0%,100%{transform:translateX(0) scaleX(.6)}50%{transform:translateX(3px) scaleX(1)}}
  .tongue{opacity:0}
  .drinking .tongue{opacity:1}

  /* being petted: squishy and blissful */
  .petted .bodyg{transform:scale(1.05,.93)}
  .petted .eye,.sleeping .eye,.petted .shine,.sleeping .shine{opacity:0}
  .petted .happyeye,.sleeping .happyeye{opacity:1}
  .happyeye{opacity:0}

  /* popcorn! */
  .pop .hop{animation:popcorn .55s cubic-bezier(.3,1.3,.5,1)}
  @keyframes popcorn{0%{transform:translateY(0) rotate(0)}
    30%{transform:translateY(-26px) rotate(-9deg)}
    55%{transform:translateY(-8px) rotate(7deg)}
    100%{transform:translateY(0) rotate(0)}}

  .sleeping .bodyg{animation:breathe 5.2s ease-in-out infinite}
  .blink .lid{animation:blinkk .22s ease-in-out}
  @keyframes blinkk{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
  .earwig .ear{animation:wig .5s ease-in-out}
  @keyframes wig{0%,100%{transform:rotate(0)}40%{transform:rotate(-16deg)}}
  .sniffing .nose{animation:wiggle .18s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}

  /* out of sorts: ears down, heavy eyelids, slower breath */
  .sad .ear{rotate:24deg}
  .sad .headg{rotate:8deg}
  .sad .lid{transform:scaleY(.42)}
  .sad .shine{opacity:.35}
  .sad .bodyg{animation-duration:5.6s}
  .sad .tail,.sad .happyeye{opacity:0}

  .bubble{position:absolute;left:50%;bottom:88%;transform:translate(-50%,6px);
    padding:5px 10px;background:#fff;border-radius:13px;white-space:nowrap;
    font-size:14px;font-weight:650;opacity:0;transition:opacity .25s,transform .25s;
    box-shadow:0 3px 8px rgba(0,0,0,.2);z-index:5}
  .bubble::after{content:"";position:absolute;left:50%;margin-left:-6px;bottom:-6px;
    border:6px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble.show{opacity:1;transform:translate(-50%,0)}

  /* ---------------- tray of food ---------------- */
  .tray{flex:0 0 auto;width:100%;max-width:860px;
    padding:9px 8px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;align-items:stretch;z-index:10}
  .item + .item{margin-left:8px}
  .item{position:relative;flex:1 1 0;min-width:0;max-width:130px;height:56px;border-radius:16px;border:0;padding:0;
    background:rgba(255,255,255,.94);box-shadow:0 4px 0 rgba(0,0,0,.3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font:inherit;font-size:.6rem;font-weight:700;color:#5b5147;
    transition:transform .09s,box-shadow .09s;touch-action:none}
  .item:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .item.cooling{filter:saturate(.5)}
  .item.cooling:active{transform:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .item .cd{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;display:none;
    align-items:center;justify-content:center;background:rgba(26,22,16,.5);
    color:#fff;font-size:.92rem;font-weight:800;letter-spacing:.5px}
  .item.cooling .cd{display:flex}
  .item svg{width:27px;height:23px;display:block}
  .item.act{background:rgba(255,255,255,.88)}

  /* tablets: bigger box, bigger everything you touch */
  @media (min-width:700px){
    h1{font-size:1.55rem}
    .status{font-size:.95rem}
    .meter{max-width:170px;padding:5px 10px 5px 7px}
    .meter span{font-size:1rem}
    .bar{height:9px}
    .boxwrap{padding:12px 16px 0}
    .box{border-radius:24px}
    .tray{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
    .item + .item{margin-left:12px}
    .item{height:72px;max-width:150px;border-radius:20px;font-size:.78rem}
    .item svg{width:36px;height:30px}
    .hint{font-size:.9rem;bottom:10px}
    .bubble{font-size:17px;padding:7px 13px}
    .wallbottle{width:96px}
  }
  @media (min-width:1000px){
    .boxwrap,.tray,header{max-width:980px}
    .item{height:80px;max-width:170px}
  }

  .ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.25);
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}

  .heart{position:fixed;pointer-events:none;z-index:98;font-size:1.4rem;
    animation:rise 1.1s ease-out forwards}
  @keyframes rise{0%{opacity:1;transform:translate(-50%,0) scale(.5)}
                  100%{opacity:0;transform:translate(-50%,-78px) scale(1.3)}}
  .zzz{position:absolute;left:60%;bottom:80%;font-size:.85rem;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.4);animation:zfloat 2.6s ease-out infinite;pointer-events:none}
  @keyframes zfloat{0%{opacity:0;transform:translate(0,0) scale(.7)}
    25%{opacity:1}100%{opacity:0;transform:translate(16px,-40px) scale(1.2)}}

  .snd{position:absolute;top:calc(9px + env(safe-area-inset-top));left:10px;z-index:30;
    width:36px;height:36px;padding:0;border:0;border-radius:50%;font-size:1rem;
    background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .snd:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .snd.off{opacity:.5}
  @media (min-width:700px){ .snd{width:46px;height:46px;font-size:1.3rem} }

  .install{position:absolute;top:calc(9px + env(safe-area-inset-top));right:10px;
    display:flex;align-items:center;gap:4px;padding:7px 11px;border:0;border-radius:99px;
    background:rgba(255,255,255,.92);color:#3f4a36;font:inherit;font-size:.72rem;font-weight:750;
    box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:30;transition:transform .09s,box-shadow .09s}
  .install:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .install.hide{display:none}
  .install .long{display:none}
  @media (min-width:600px){
    .install{font-size:.86rem;padding:9px 15px;gap:6px}
    .install .short{display:none}
    .install .long{display:inline}
  }
  .sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(20,16,12,.62);padding:22px}
  .sheet.show{display:flex}

<script>
/* ============================ helpers ============================ */
/* Element.animate is missing on some older Android builds, and throwing
   inside a click handler would stop the rest of it running */
function softAnimate(el, frames, opts){
  try { if (el && el.animate) el.animate(frames, opts); } catch (e) {}
}
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const floor = document.getElementById('floor');
const statusEl = document.getElementById('status');
let statusHold = 0;
function say(t, sticky){
  if (!sticky && Date.now() < statusHold) return;
  statusEl.textContent = t;
  if (sticky) statusHold = Date.now() + 2600;
}

/* ============================ box geometry ============================ */
let FW = 0, FH = 0, yNear = 0, yFar = 0;
function measure(){
  const w = floor.clientWidth, h = floor.clientHeight;
  if (w > 60 && h > 60){ FW = w; FH = h; yNear = FH*0.10; yFar = FH*0.76; }
}
measure();
const depth   = y => (y - yNear) / Math.max(1, yFar - yNear);
const scaleAt = y => 1 - 0.22*clamp(depth(y), 0, 1);
const atDepth = d => yNear + d*(yFar - yNear);

const props = [];
function placeProp(el, fx, fd, extra, zOff){
  const y = atDepth(fd), s = scaleAt(y)*(extra||1);
  const t = `translate(${fx*FW}px, ${-y}px) translateX(-50%) scale(${s})`;
  el.style.setProperty('--t', t);
  el.style.transform = t;
  el.style.zIndex = Math.round(500 - y + (zOff||0));
}
function layoutProps(){ props.forEach(p => placeProp(p.el, p.fx, p.fd, p.extra, p.zOff)); }

/* where things live inside the box */
/* Everything lines up along the back of the cage: the two nests together on
   the left like a pair of neighbours, then the food and water to the right. */
const SPOT = {
  nestA :{fx:.16, fd:.92},
  nestB :{fx:.49, fd:.92},     // side by side in the top left, like neighbours
  hay   :{fx:.86, fd:.72},
  bowl  :{fx:.88, fd:.52},
  bottle:{fx:.80, fd:.62}      // where a piggy stands to drink
};
const spot = k => ({x: SPOT[k].fx*FW, y: atDepth(SPOT[k].fd)});

/* ============================ bedding ============================ */
(function bedding(){
  // a few pellets of evidence that piggies live here
  for (let i=0;i<9;i++){
    const d = document.createElement('div');
    d.className = 'poop';
    Object.assign(d.style,{left:rnd(6,90)+'%',top:rnd(30,92)+'%',
      transform:`rotate(${rnd(0,180)}deg)`, zIndex:2});
    floor.appendChild(d);
  }
})();

/* ============================ props ============================ */
function addProp(fx, fd, cls, html, extra, zOff){
  const d = document.createElement('div');
  d.className = 'prop ' + (cls||'');
  d.innerHTML = html;
  floor.appendChild(d);
  props.push({el:d, fx, fd, extra, zOff});
  return d;
}

/* water bottle, clipped to the box wall like the real one */
const bottleEl = document.createElement('div');
bottleEl.className = 'bottle wallbottle';
bottleEl.innerHTML =
  `<div class="glow"></div>
   <svg width="74" height="150" viewBox="0 0 74 150">
     <rect x="6" y="26" width="62" height="9" rx="4" fill="#9aa1ab"/>
     <rect x="6" y="26" width="62" height="4" rx="2" fill="#c3c9d1"/>
     <rect x="17" y="14" width="40" height="86" rx="18" fill="#2f3238"/>
     <rect x="17" y="14" width="15" height="86" rx="8" fill="#4a4f57"/>
     <rect x="21" y="21" width="32" height="72" rx="14" fill="#1f2226" opacity=".5"/>
     <rect id="waterFill" x="22" y="40" width="30" height="52" rx="13" fill="#5cc0e8" opacity=".92"/>
     <rect x="25" y="8" width="24" height="10" rx="5" fill="#8d949e"/>
     <path d="M32 100 h10 l-2 26 h-6 z" fill="#b9c0c8"/>
     <circle cx="37" cy="130" r="5.5" fill="#e4e9ee"/>
     <circle cx="37" cy="130" r="2.4" fill="#a9b2bb"/>
   </svg>`;
document.getElementById('box').appendChild(bottleEl);

/* pellet bowl */
const bowlEl = addProp(SPOT.bowl.fx, SPOT.bowl.fd, 'bowl',
  `<svg width="72" height="40" viewBox="0 0 72 40">
     <ellipse cx="36" cy="30" rx="32" ry="9" fill="#8a5a3c"/>
     <path d="M6 22 q30 12 60 0 l-5 10 q-25 8 -50 0 z" fill="#a9714b"/>
     <ellipse cx="36" cy="21" rx="30" ry="9" fill="#c78a5c"/>
     <ellipse cx="36" cy="21" rx="25" ry="6.5" fill="#7d4f33"/>
     <g id="pellets" fill="#c9a45e">
       <ellipse cx="27" cy="20" rx="4" ry="2.6"/><ellipse cx="36" cy="22" rx="4" ry="2.6"/>
       <ellipse cx="45" cy="20" rx="4" ry="2.6"/><ellipse cx="32" cy="18" rx="4" ry="2.6"/>
       <ellipse cx="41" cy="18" rx="4" ry="2.6"/>
     </g>
   </svg>`, 1.25);

/* hay pile */
/* A house each, drawn in two layers so a piggy can be *inside* it: the dark
   interior goes behind them, the roof, posts and threshold in front. Standing
   at the house's own depth puts them neatly between the two. */
function nestBackSVG(){
  return `<svg width="132" height="140" viewBox="0 0 132 140">
    <ellipse cx="66" cy="133" rx="56" ry="6" fill="rgba(0,0,0,.22)"/>
    <!-- the inside: dark, with a lit floor and a little bedding -->
    <path d="M20 128 L20 56 Q20 46 32 46 L100 46 Q112 46 112 56 L112 128 Z" fill="#3a2a1a"/>
    <path d="M20 128 L20 56 Q20 46 32 46 L52 46 Q38 58 36 128 Z" fill="#2c1f12"/>
    <path d="M24 128 q42 -10 84 0 z" fill="#5a4229"/>
    <g stroke="#c9a45e" stroke-width="2" stroke-linecap="round" opacity=".5">
      <path d="M32 126 l9 -7 M48 127 l9 -7 M66 126 l9 -6 M84 127 l9 -7"/></g>
  </svg>`;
}
function nestFrontSVG(roof, trim, wall){
  return `<svg width="132" height="140" viewBox="0 0 132 140">
    <!-- shade falling into the doorway, over whoever is in there -->
    <path d="M20 46 h92 v26 q-46 12 -92 0 z" fill="#241a0f" opacity=".5"/>
    <!-- side posts -->
    <path d="M6 130 L6 54 Q6 44 18 44 L26 44 L26 130 Z" fill="${wall}"/>
    <path d="M106 130 L106 44 L114 44 Q126 44 126 54 L126 130 Z" fill="${wall}"/>
    <g stroke="${trim}" stroke-width="1.5" opacity=".5">
      <path d="M6 74 h20 M6 98 h20 M106 74 h20 M106 98 h20"/></g>
    <!-- roof, overhanging enough to hide a head poking up -->
    <path d="M66 4 L128 52 L120 62 L66 20 L12 62 L4 52 Z" fill="${roof}"/>
    <path d="M66 11 L120 54 L66 24 L12 54 Z" fill="${trim}" opacity=".5"/>
    <!-- a low front lip: enough to sit behind, low enough that most of a
         piggy still shows when it is indoors -->
    <path d="M26 108 h80 q6 0 6 6 v10 q0 6 -6 6 H26 q-6 0 -6 -6 v-10 q0 -6 6 -6z" fill="${wall}"/>
    <path d="M26 108 h80 q6 0 6 6 v4 H20 v-4 q0 -6 6 -6z" fill="${trim}"/>
    <g stroke="${trim}" stroke-width="1.3" opacity=".4"><path d="M50 114 v14 M78 114 v14"/></g>
    <!-- threshold -->
    <path d="M10 126 h112 q5 0 5 5 v3 q0 4 -5 4 H10 q-5 0 -5 -4 v-3 q0 -5 5 -5z" fill="${wall}"/>
    <path d="M10 126 h112 q5 0 5 5 v1 H5 v-1 q0 -5 5 -5z" fill="${trim}" opacity=".7"/>
  </svg>`;
}
const NEST_ART_W = 132;                    // width of the house drawing
function makeNest(key, roof, trim, wall){
  const sp = SPOT[key];
  const back  = addProp(sp.fx, sp.fd, 'nest-back',  nestBackSVG(),                    0.9, -14);
  const front = addProp(sp.fx, sp.fd, 'nest-front', nestFrontSVG(roof, trim, wall), 0.9, +14);
  back.dataset.nest = key; front.dataset.nest = key;
  return front;
}

/* The piggies grow with the screen, so the houses have to as well — a house
   should always be comfortably bigger than its occupant, on a phone and on a
   tablet alike. This works out the size from the animal, then places the pair
   side by side on the left with a real gap between them. */
function fitNests(){
  if (FW < 60) return;
  const drawnPig = 1.04 * pigWidth();               // the animal is a little wider than its box
  const scale = clamp((drawnPig * 1.52) / NEST_ART_W, 0.8, 3);
  const depthScale = scaleAt(atDepth(SPOT.nestA.fd));
  const w = NEST_ART_W * scale * depthScale;        // house width on screen
  const gap = Math.max(12, FW * 0.045);

  let ax = Math.max(w/2 + FW*0.02, FW*0.21);        // keep the pair towards the left
  let bx = ax + w + gap;
  if (bx + w/2 > FW*0.97){                          // ran out of room: pull them in
    bx = FW*0.97 - w/2;
    ax = Math.max(w/2 + FW*0.02, bx - w - gap);
  }
  SPOT.nestA.fx = ax / FW;
  SPOT.nestB.fx = bx / FW;
  props.forEach(pr => {
    const key = pr.el.dataset && pr.el.dataset.nest;
    if (!key) return;
    pr.extra = scale;
    pr.fx = SPOT[key].fx;
  });
}
const nestA = makeNest('nestA', '#8f6a45', '#c49a68', '#b0855a');
const nestB = makeNest('nestB', '#6f6350', '#a89272', '#94836a');

/* hay kept in a box instead of loose on the floor */
const hayEl = addProp(SPOT.hay.fx, SPOT.hay.fd, 'hay',
  `<svg width="96" height="76" viewBox="0 0 96 76">
     <ellipse cx="48" cy="70" rx="40" ry="6" fill="rgba(0,0,0,.2)"/>
     <g stroke="#d8b45e" stroke-width="2.6" stroke-linecap="round">
       <path d="M26 34 L20 12 M34 32 L32 8 M44 31 L46 6 M54 32 L60 10 M64 34 L72 16"/></g>
     <g stroke="#efd48f" stroke-width="1.7" stroke-linecap="round" opacity=".9">
       <path d="M30 33 L28 14 M40 31 L41 10 M50 31 L55 12 M60 33 L67 18"/></g>
     <path d="M14 40 h68 q4 0 4 4 v22 q0 4 -4 4 h-68 q-4 0 -4 -4 v-22 q0 -4 4 -4z" fill="#a9764a"/>
     <path d="M14 40 h68 q4 0 4 4 v6 h-76 v-6 q0 -4 4 -4z" fill="#c08c58"/>
     <g stroke="#8c603a" stroke-width="1.4" opacity=".8"><path d="M10 56 h76 M32 44 v26 M64 44 v26"/></g>
   </svg>`, 1.1);

layoutProps();

/* ============================ the time of day ============================ */
/* morning they are hungry, afternoons are for naps, evenings are silly,
   nights are quiet */
function phaseNow(){
  const h = new Date().getHours();
  return h < 6  ? 'night'
       : h < 11 ? 'morning'
       : h < 17 ? 'day'
       : h < 22 ? 'evening'
       :          'night';
}
let PHASE = phaseNow();
function phaseGreeting(){
  return PHASE === 'morning' ? 'Good morning! They are hungry. 🌅'
       : PHASE === 'day'     ? 'Sleepy afternoon in the box. ☀️'
       : PHASE === 'evening' ? 'Evening! They have the zoomies. 🌆'
       :                       'Shh… it is night. They are sleeping. 🌙';
}
function applyPhase(){
  PHASE = phaseNow();
  document.getElementById('box').classList.toggle('night', PHASE === 'night');
}
applyPhase();
setInterval(()=>{
  const was = PHASE;
  applyPhase();
  if (PHASE !== was) say(phaseGreeting(), true);
}, 60000);

/* ============================ the piggies ============================ */
/* one silhouette, painted in tricolour patches per pig */
function pigSVG(id, c){
  return `
<svg class="psvg" viewBox="0 0 220 150">

/* Lalu — the one with the big black side patch and ginger head.
   Peelu — mostly white, ginger cheek, dark ear patch. */
const COATS = {
  lalu: {

/* ============================ needs ============================ */
const need = {food:78, water:74, love:66, clean:88};

/* one life line: the worst-cared-for thing drags it down hardest */
function heartValue(){
  const vals = [need.food, need.water, need.love, need.clean].map(v => clamp(v,0,100));
  const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
  const worst = Math.min(...vals);
  return clamp(Math.round(worst*0.5 + avg*0.5), 0, 100);
}
let sadMode = false;
function setSad(on){
  if (on === sadMode) return;
  sadMode = on;
  HERD.forEach(p => {
    p.el.classList.toggle('sad', on);
    if (on){ p.bubbleSay('…', 2600); }
    else { p.bubbleSay(pick(['wheek!','♥','popcorn!']), 1800); p.popcorn(); }
  });
  say(on ? 'They are sad. Give them food, water and pets. 💔'
         : 'They are happy again! ❤️', true);
}
function paintNeeds(){
  const h = heartValue();
  const bar = document.getElementById('mHeart');
  bar.style.width = h + '%';
  bar.classList.toggle('low', h < 35);
  document.getElementById('heartPct').textContent = h + '%';
  document.getElementById('heartIcon').textContent = h === 0 ? '💔' : (h < 35 ? '🧡' : '❤️');
  document.querySelector('.meter.life').classList.toggle('fading', h > 0 && h < 35);
  if (h === 0) setSad(true);
  else if (sadMode && h > 12) setSad(false);
  const wf = document.getElementById('waterFill');
  if (wf){ const h = 6 + 72*(clamp(need.water,0,100)/100);   // bottle body runs y=14..98
    wf.setAttribute('y', (98 - h).toFixed(1)); wf.setAttribute('height', h.toFixed(1)); }
  bottleEl.classList.toggle('thirsty', need.water < 45);
  document.getElementById('box').classList.toggle('grubby', need.clean < 30);
  const p = document.getElementById('pellets');
  if (p) p.style.opacity = need.food < 25 ? .25 : 1;
}
paintNeeds();
setInterval(()=>{                        // needs drift down over a few minutes
  const slow = PHASE === 'night' ? 0.45 : 1;   // asleep, so they need less
  need.food  = clamp(need.food  - .5*slow, 0, 100);
  need.water = clamp(need.water - .45*slow, 0, 100);
  need.love  = clamp(need.love  - .35*slow, 0, 100);
  need.clean = clamp(need.clean - .6*slow, 0, 100);
  if (need.clean < 25) need.love = clamp(need.love - .5, 0, 100);   // a grubby box is no fun
  paintNeeds();
  if (need.food < 22 && Math.random() < .5) HERD.forEach(p => p.wheek());
}, 6000);

/* the box slowly gets messier: a piggy leaves a little something now and then */
function dropPellet(x, y){
  const d = document.createElement('div');
  d.className = 'poop mess';
  d.style.left = 'auto'; d.style.top = 'auto';
  d.style.transform = `translate(${x}px, ${-y}px)`;
  d.style.zIndex = 3;
  floor.appendChild(d);
}
setInterval(()=>{
  if (need.clean < 6 || FW < 60) return;
  const p = pick(HERD); p.syncFromDOM();
  dropPellet(clamp(p.x + rnd(-14,14), 8, FW-8), clamp(p.y + rnd(-6,6), yNear, yFar));
  need.clean = clamp(need.clean - 2.5, 0, 100);
  paintNeeds();
}, 17000);

/* ============================ a piggy ============================ */
const crumbs = [];                        // food dropped in the box

class Pig {
  constructor(id, coat, opts){
    this.id = id; this.name = opts.name; this.opts = opts;
    this.el = document.createElement('div');
    this.el.className = 'pig';
    this.el.style.width = (opts.width||150) + 'px';
    this.el.innerHTML =
      `<div class="shadow"></div>` +
      `<div class="hop"><div class="flip">${pigSVG(id, coat)}</div></div>` +
      `<div class="bubble"></div>`;
    this.hopEl = this.el.querySelector('.hop');
    this.flip = this.el.querySelector('.flip');
    this.bubble = this.el.querySelector('.bubble');
    this.sizeMul = opts.sizeMul || 1;
    this.speed = opts.speed || 52;
    this.fx = opts.fx; this.fd = opts.fd;
    this.x = this.fx*FW; this.y = atDepth(this.fd);
    this.facing = opts.facing || 1;
    if (this.facing === -1) this.flip.classList.add('left');
    floor.appendChild(this.el);
    this.render(true);

    this.el.addEventListener('pointerdown', e => { e.stopPropagation(); this.startPet(e); });
    this.el.addEventListener('transitionend', e => {
      // only the wrapper's own move counts — .bodyg / .headg pose transitions
      // bubble up here too, and would end the walk the moment it started
      if (e.target !== this.el || e.propertyName !== 'transform') return;
      if (this.arrive){ const f = this.arrive; this.arrive = null; f(); }
    });
    setInterval(()=>{ if (this.el.classList.contains('sleeping')) return;
      this.el.classList.add('blink');
      setTimeout(()=>this.el.classList.remove('blink'), 240); }, rnd(2800,4800));
    setInterval(()=>{ this.el.classList.add('earwig');
      setTimeout(()=>this.el.classList.remove('earwig'), 520); }, rnd(6000,11000));
    this.timer = setTimeout(()=>this.think(), 400 + Math.random()*600);
  }

  render(instant){
    const s = scaleAt(this.y)*this.sizeMul;
    if (instant) this.el.style.transitionDuration = '0s';
    this.el.style.transform =
      `translate(${this.x}px, ${-this.y}px) translateX(-50%) scale(${s})`;
    this.el.style.zIndex = Math.round(500 - this.y);
  }
  syncFromDOM(){
    const f = floor.getBoundingClientRect(), r = this.el.getBoundingClientRect();
    if (!f.width) return;
    this.x = r.left + r.width/2 - f.left;
    this.y = f.bottom - r.bottom;
    this.mark();
  }
  mark(){ this.fx = this.x/Math.max(1,FW); this.fd = depth(this.y); }
  clampX(x, y){
    const m = (this.opts.width||150)*scaleAt(y)*this.sizeMul*0.34;
    return clamp(x, m, FW - m);
  }
  state(cls){
    this.el.classList.remove('walking','eating','nibbling','drinking','petted','sleeping','sniffing');
    if (cls) this.el.classList.add(cls);
    if (cls !== 'sleeping') this.el.querySelectorAll('.zzz').forEach(z => z.remove());
  }
  clear(){ clearTimeout(this.timer); this.arrive = null; }
  bubbleSay(t, ms){
    this.bubble.textContent = t; this.bubble.classList.add('show');
    clearTimeout(this._b);
    this._b = setTimeout(()=>this.bubble.classList.remove('show'), ms||1600);
  }
  wheek(){ if (this.el.classList.contains('sleeping')) return;
    this.bubbleSay(pick(['wheek!','WHEEK!','wheeek~'])); sndWheek(); }

  walkTo(x, y, then){
    this.syncFromDOM();
    this.el.style.transitionDuration = '0s';    // pin where it actually is
    this.render();
    void this.el.offsetWidth;
    y = clamp(y, yNear, yFar);
    x = this.clampX(x, y);
    const dx = x - this.x, dy = y - this.y;
    const dist = Math.hypot(dx, dy*0.8);
    if (dist < 5){ then && then(); return; }
    if (Math.abs(dx) > 3){ this.facing = dx < 0 ? -1 : 1;
      this.flip.classList.toggle('left', this.facing === -1); }
    const dur = dist/(this.speed*scaleAt((this.y+y)/2));
    this.x = x; this.y = y; this.mark();
    this.state('walking');
    this.el.style.transitionProperty = 'transform';
    this.el.style.transitionTimingFunction = 'cubic-bezier(.4,.05,.55,.95)';
    this.el.style.transitionDuration = dur + 's';
    this.render();
    this.arrive = ()=>{ this.state(null); then && then(); };
  }
  hold(cls, sec, then){
    this.state(cls);
    this.timer = setTimeout(()=>{ this.state(null); then && then(); }, sec*1000);
  }
  popcorn(){
    if (sadMode) return;                       // no bouncing while miserable
    this.el.classList.add('pop');
    setTimeout(()=>this.el.classList.remove('pop'), 600);
  }

  /* --- petting: hold a finger on them --- */
  startPet(e){
    this.clear();
    this.petting = true;
    this.state('petted');
    this.bubbleSay(pick(['purrr…','rrrr~','♥','mmm…']), 2200);
    sndPurr();
    say(`${this.name} likes this!`, true);
    const heartAt = (ev)=>{ if (!ev) return;
      const h = document.createElement('div'); h.className = 'heart';
      h.textContent = pick(['💗','💕','✨','💖']);
      h.style.left = (ev.clientX + rnd(-18,18)) + 'px';
      h.style.top  = (ev.clientY + rnd(-14,6)) + 'px';
      document.body.appendChild(h); setTimeout(()=>h.remove(), 1150); };
    heartAt(e);
    clearInterval(this._petLoop);
    this._petLoop = setInterval(()=>{
      if (!this.petting) return;
      need.love = clamp(need.love + 1.6, 0, 100); paintNeeds();
      heartAt(this._lastPointer || e);
      if (navigator.vibrate) navigator.vibrate(6);
    }, 420);
    need.love = clamp(need.love + 3, 0, 100); paintNeeds();
    if (navigator.vibrate) navigator.vibrate(12);
  }
  stopPet(){
    if (!this.petting) return;
    this.petting = false;
    clearInterval(this._petLoop);
    this.state(null);
    if (need.love > 72 && Math.random() < .7){ this.popcorn(); this.bubbleSay('popcorn!', 1200); }
    this.timer = setTimeout(()=>this.think(), 500);
  }

  /* --- going to things --- */
  goDrink(){
    this.clear();
    const b = spot('bottle');
    this.walkTo(b.x - 34, b.y - 8, ()=>{
      this.facing = 1; this.flip.classList.remove('left');
      this.hold('drinking', rnd(2.6,4.2), ()=>{
        need.water = clamp(need.water + 26, 0, 100); paintNeeds();
        say(`${this.name} drank some water. 💧`);
        this.think();
      });
    });
  }
  /* stand so the food sits right at the nose, then work through it bite by
     bite until the whole piece is gone */
  mouthOffset(y){
    return 0.46 * (this.opts.width || 140) * scaleAt(y) * this.sizeMul;
  }
  goEatCrumb(crumb){
    this.clear();
    this.target = crumb;
    if (!crumb.el.isConnected || !crumbs.includes(crumb)) return this.think();
    this.syncFromDOM();
    const side = this.x <= crumb.x ? 1 : -1;          // walk up to whichever side it's on
    const stand = crumb.x - side * this.mouthOffset(crumb.y);
    this.walkTo(stand, crumb.y + 6, ()=>{
      this.facing = side;                              // nose towards the food
      this.flip.classList.toggle('left', side === -1);
      this.bubbleSay(pick(['nom nom','munch','mmm!']), 1400);
      this.eatCrumb(crumb);
    });
  }
  eatCrumb(crumb){
    if (!crumb.el.isConnected || !crumbs.includes(crumb)) return this.think();
    this.hold('eating', rnd(1.7,2.6), ()=>{
      crumb.bites--;
      need.food = clamp(need.food + 12, 0, 100);
      need.love = clamp(need.love + 2, 0, 100);
      paintNeeds();
      if (crumb.bites > 0){
        crumb.el.style.transform = crumb.el.style.getPropertyValue('--t') +
          ` scale(${0.5 + 0.5*crumb.bites/crumb.max})`;
        say(`${this.name} is eating the ${crumb.kind}. 🥬`);
        return this.eatCrumb(crumb);                   // keep at it until it's finished
      }
      crumb.el.style.transition = 'opacity .4s,transform .4s';
      crumb.el.style.opacity = 0;
      setTimeout(()=>crumb.el.remove(), 420);
      const i = crumbs.indexOf(crumb); if (i >= 0) crumbs.splice(i, 1);
      say(`${this.name} ate all the ${crumb.kind}! 🎉`, true);
      this.bubbleSay(pick(['all gone!','♥','wheek!']), 1500);
      if (Math.random() < .7) this.popcorn();
      this.timer = setTimeout(()=>this.think(), 700);
    });
  }
  goNibbleHay(){
    this.clear();
    const h = spot('hay');
    this.walkTo(h.x + rnd(-30,30), h.y - rnd(4,14), ()=>{
      this.hold('nibbling', rnd(3,6), ()=>{
        need.food = clamp(need.food + 7, 0, 100); paintNeeds();
        this.think();
      });
    });
  }
  goBowl(){
    this.clear();
    const b = spot('bowl');
    this.walkTo(b.x + rnd(-14,26), b.y - rnd(2,10), ()=>{
      this.hold('eating', rnd(2.5,4.5), ()=>{
        need.food = clamp(need.food + 9, 0, 100); paintNeeds();
        this.think();
      });
    });
  }
  goRead(){                                  // wander over and sniff the paper
    this.clear();
    if (Date.now() - lastPigRead < 30000) return this.think();   // not every minute
    this.walkTo(FW*0.80, yNear + rnd(2,16), ()=>{     // the scrap is at the front right now
      this.bubbleSay(pick(['sniff','?','nom?']), 1300);
      lastPigRead = Date.now();
      nextLetter(true);
      this.hold('sniffing', rnd(1.6,3), ()=>this.think());
    });
  }
  zoomies(laps){                             // a quick silly lap of the box
    laps = laps == null ? 2 + Math.floor(Math.random()*2) : laps;
    if (laps <= 0 || sadMode) return this.think();
    const boost = this.speed;
    this.speed = boost * 2.1;
    this.walkTo(rnd(FW*0.14, FW*0.86), rnd(yNear+6, yFar-6), ()=>{
      this.speed = boost;
      if (Math.random() < .4) this.bubbleSay(pick(['wheeek!','!!','zoom!']), 900);
      this.timer = setTimeout(()=>this.zoomies(laps - 1), 120);
    });
  }
  goNest(sleepFor){
    this.clear();
    const n = spot(this.opts.nest || 'nestA');
    // the house's two layers sit either side of this depth, so stopping here
    // puts the piggy inside the doorway
    this.walkTo(n.x + rnd(-4,4), n.y + 6, ()=>{      // a little way in
      this.bubbleSay('…', 1200);
      if (sleepFor) return this.sleep(sleepFor);
      this.hold('sleeping', rnd(6,12), ()=>this.think());
    });
  }
  goHide(){ return this.goNest(); }
  sleep(sec){
    this.state('sleeping');
    for (let i=0;i<2;i++){
      const z = document.createElement('div'); z.className = 'zzz'; z.textContent = 'z';
      z.style.animationDelay = (i*1.2) + 's';
      this.el.appendChild(z);
    }
    this.timer = setTimeout(()=>{ this.state(null); this.think(); }, sec*1000);
  }

  think(){
    this.clear();
    if (FW < 60){ this.timer = setTimeout(()=>this.think(), 250); return; }
    if (this.petting) return;
    if (this.x < 4 && this.y < 4){          // recover from a bad first layout
      this.y = atDepth(this.fd || .5);
      this.x = this.clampX((this.fx || .5)*FW, this.y);
      this.render(true);
    }

    // needs first
    if (crumbs.length && need.food < 96){
      const mine = crumbs.filter(c => c.owner === this);
      const spare = crumbs.filter(c => !c.owner);
      const pool = mine.length ? mine : (spare.length ? spare : crumbs);  // only share once yours is gone
      let best = null, bd = 1e9;
      pool.forEach(c => { const d = Math.hypot(c.x-this.x, c.y-this.y);
        if (d < bd){ bd = d; best = c; } });
      if (best) return this.goEatCrumb(best);
    }
    if (need.water < 42) return this.goDrink();
    if (need.food  < 40) return Math.random() < .6 ? this.goNibbleHay() : this.goBowl();

    if (sadMode){                              // low on everything: just mope
      if (Math.random() < .3) this.bubbleSay('…', 2200);
      return this.hold(pick(['chewing','sniffing']), rnd(4,8), ()=>this.think());
    }

    // night: mostly curled up asleep
    if (PHASE === 'night'){
      if (Math.random() < .8) return this.goNest(rnd(12,24));   // home to bed
    }
    // afternoon: long naps
    if (PHASE === 'day' && Math.random() < .4)
      return Math.random() < .6 ? this.goNest(rnd(8,16)) : this.sleep(rnd(8,16));
    // morning: hungry, straight to the food
    if (PHASE === 'morning' && Math.random() < .45){
      if (Math.random() < .35) this.wheek();
      return Math.random() < .5 ? this.goNibbleHay() : this.goBowl();
    }
    // evening: zoomies and silliness
    if (PHASE === 'evening' && Math.random() < .3 && !sadMode){
      this.popcorn();
      return this.zoomies();
    }

    const r = Math.random();
    if (r < .16 && need.love > 55) { this.popcorn();
      this.timer = setTimeout(()=>this.think(), 900); return; }
    if (r < .10) return this.goRead();                 // go and sniff the letter
    if (r < .34) return this.hold('sniffing', rnd(1.6,3.4), ()=>this.think());
    if (r < .44) return this.goNibbleHay();
    if (r < .52) return this.goDrink();
    if (r < .60) return this.goHide();
    if (r < .68 && need.love > 40) return this.sleep(rnd(5,11));
    if (r < .78){                            // nose-to-nose with the other one
      const o = HERD.find(p => p !== this);
      if (o){ o.syncFromDOM();
        const gap = (this.opts.width || 140) * 0.58;      // stand beside, not on top of
        return this.walkTo(o.x + (this.x < o.x ? -gap : gap), o.y + rnd(-10,10), ()=>{
          this.bubbleSay(pick(['♥','sniff sniff','wheek?']), 1400);
          this.hold('sniffing', rnd(1.6,3), ()=>this.think());
        });
      }
    }
    // wander
    this.walkTo(rnd(FW*0.14, FW*0.86), rnd(yNear+6, yFar-6),
      ()=>this.hold(pick(['sniffing','nibbling']), rnd(1.5,3.5), ()=>this.think()));
  }
}

const pigWidth = () => clamp((FW || floor.clientWidth || innerWidth*0.9)*0.32, 112, 190);
const lalu  = new Pig('L', COATS.lalu,  {name:'Lalu',  fx:.30, fd:.55, width:pigWidth(), speed:50,
                                          facing:1,  nest:'nestA'});
const peelu = new Pig('P', COATS.peelu, {name:'Peelu', fx:.62, fd:.38, width:pigWidth(), speed:58,
                                          sizeMul:.92, facing:-1, nest:'nestB'});
const HERD = [lalu, peelu];

/* ============================ feeding ============================ */
const FOODS = {
  cabbage:{bites:3, svg:`<svg width="44" height="42" viewBox="0 0 44 42">
      <circle cx="22" cy="21" r="17" fill="#b7d977"/>
      <path d="M22 5 C14 10 12 21 17 37" stroke="#8fbc5c" stroke-width="2.2" fill="none"/>
      <path d="M22 5 C30 10 32 21 27 37" stroke="#8fbc5c" stroke-width="2.2" fill="none"/>
      <path d="M6 21 C12 16 32 16 38 21" stroke="#8fbc5c" stroke-width="2" fill="none"/>
      <circle cx="16" cy="15" r="4.5" fill="#d6ecab" opacity=".65"/>
      <circle cx="22" cy="21" r="17" fill="none" stroke="#7ba84e" stroke-width="2.4"/></svg>`},
  cucumber:{bites:3, svg:`<svg width="46" height="34" viewBox="0 0 46 34">
      <ellipse cx="23" cy="17" rx="19" ry="12" fill="#cfe79b"/>
      <ellipse cx="23" cy="17" rx="14" ry="8" fill="#eaf5cd"/>
      <g fill="#c2d98c"><circle cx="18" cy="15" r="1.6"/><circle cx="25" cy="19" r="1.6"/>
      <circle cx="29" cy="14" r="1.6"/></g>
      <ellipse cx="23" cy="17" rx="19" ry="12" fill="none" stroke="#8fb95a" stroke-width="2.4"/></svg>`},
  carrot:{bites:4, svg:`<svg width="40" height="44" viewBox="0 0 40 44">
      <path d="M11 40 C7 27 13 12 20 8 C26 15 24 32 15 42 Z" fill="#ef8a34"/>
      <path d="M15 36 C15 27 17 19 20 14" stroke="#d9762a" stroke-width="1.7" fill="none"/>
      <path d="M20 8 C21 2 27 0 30 3 C27 6 24 8 22 9 Z" fill="#6faa3f"/></svg>`}
};
function dropPiece(kind, x, y){
  const f = FOODS[kind]; if (!f) return null;
  y = clamp(y, yNear, yFar);
  x = clamp(x, FW*0.08, FW*0.92);
  const s = scaleAt(y);
  const el = document.createElement('div');
  el.className = 'crumb';
  el.innerHTML = f.svg;
  const t = `translate(${x}px, ${-y}px) translateX(-50%) scale(${s}) rotate(${rnd(-18,18)}deg)`;
  el.style.setProperty('--t', t);
  el.style.transform = t;
  el.style.zIndex = Math.round(500 - y);
  floor.appendChild(el);
  const crumb = {el, x, y, bites:f.bites, max:f.bites, kind, owner:null};
  crumbs.push(crumb);
  return crumb;
}
/* a portion each, dropped well apart, so nobody has to share */
function dropFood(kind, x, y){
  if (cooling(kind)){ refuse(kind); return; }
  const a = dropPiece(kind, x, y);
  if (!a) return;
  startCooldown(kind);
  const away = (x > FW*0.5 ? -1 : 1) * rnd(FW*0.26, FW*0.40);
  const b = dropPiece(kind, x + away, y + rnd(-FH*0.14, FH*0.14));
  say(`${kind[0].toUpperCase()+kind.slice(1)} for both of them! 🥬`, true);
  if (!b){ HERD.forEach((p,i)=> setTimeout(()=>{ if(!p.petting){ p.clear(); p.wheek(); p.goEatCrumb(a); } }, i*300)); return; }

  // hand each piggy whichever piece is nearer, keeping them apart
  const [p1, p2] = HERD;
  p1.syncFromDOM(); p2.syncFromDOM();
  const dist = (p,c) => Math.hypot(p.x - c.x, (p.y - c.y)*0.8);
  const straight = dist(p1,a) + dist(p2,b);
  const crossed  = dist(p1,b) + dist(p2,a);
  const pairs = straight <= crossed ? [[p1,a],[p2,b]] : [[p1,b],[p2,a]];
  pairs.forEach(([p,c], i) => {
    c.owner = p;
    setTimeout(()=>{ if (p.petting) return; p.clear(); p.wheek(); p.goEatCrumb(c); }, i*rnd(160,420));
  });
}



/* ====================== little sounds ======================
   A guinea pig wheek is a short rising squeak. Kept soft and brief, low in
   volume, and behind a mute button that remembers your choice. Phones only
   allow sound after the first touch, so it waits for that. */
var AC = null, audioOn = true, audioTouched = false, lastSnd = 0;
try { audioOn = localStorage.getItem('lp-mute') !== '1'; } catch (e) {}

function actx(){
  try {
    if (!AC){ var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch (e) { return null; }
}

/* a short, soft wheek */
function sndWheek(force){
  if (!audioOn || !audioTouched) return;
  if (!force && Date.now() - lastSnd < 6000) return;
  var ac = actx(); if (!ac) return;
  lastSnd = Date.now();
  var t = ac.currentTime, base = rnd(500, 660), len = 0.34;

  var amp = ac.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.085, t + 0.05);
  amp.gain.setValueAtTime(0.085, t + len * 0.55);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.12);

  var lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2300; lp.Q.value = 0.6;

  [['triangle', 1, 0.9], ['sine', 2, 0.12]].forEach(function (v){
    var o = ac.createOscillator(); o.type = v[0];
    o.frequency.setValueAtTime(base * v[1], t);
    o.frequency.linearRampToValueAtTime(base * 1.6 * v[1], t + 0.12);   // the rise
    o.frequency.linearRampToValueAtTime(base * 1.15 * v[1], t + len);   // and settle
    var g = ac.createGain(); g.gain.value = v[2];
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + len + 0.16);
  });
  lp.connect(amp); amp.connect(ac.destination);
}

/* a low rumble for when they are being petted */
function sndPurr(){
  if (!audioOn || !audioTouched) return;
  var ac = actx(); if (!ac) return;
  var t = ac.currentTime, len = 0.5;
  var o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(108, t);
  o.frequency.linearRampToValueAtTime(96, t + len);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
  var amp = ac.createGain();
  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.linearRampToValueAtTime(0.075, t + 0.08);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + len);
  var flut = ac.createOscillator(); flut.frequency.value = 22;          // the rumble
  var flutG = ac.createGain(); flutG.gain.value = 0.03;
  flut.connect(flutG); flutG.connect(amp.gain);
  o.connect(lp); lp.connect(amp); amp.connect(ac.destination);
  o.start(t); o.stop(t + len + 0.05);
  flut.start(t); flut.stop(t + len + 0.05);
}

/* ---- the small noises of a guinea pig going about its business ----
   All of these are built from a short burst of noise, which sounds more like
   bedding and chewing than any tone would. They are deliberately far quieter
   than the wheek: texture you notice only when the room is quiet. */
var noiseBuf = null;
function noiseSource(ac){
  if (!noiseBuf){
    var n = Math.floor(ac.sampleRate * 0.35);
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  var src = ac.createBufferSource();
  src.buffer = noiseBuf;
  return src;
}
/* one short burst, shaped by a filter and an envelope */
function burst(opts){
  if (!audioOn || !audioTouched) return;
  var ac = actx(); if (!ac) return;
  var t = ac.currentTime;
  var src = noiseSource(ac);
  src.playbackRate.value = opts.rate || 1;
  var f = ac.createBiquadFilter();
  f.type = opts.type || 'bandpass';
  f.frequency.value = opts.freq || 1600;
  f.Q.value = opts.q || 1;
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(opts.vol, t + (opts.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + opts.len);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + opts.len + 0.02);
}
/* a foot shuffling over the bedding */
function sndStep(near){
  burst({freq: rnd(900, 1500), q: 0.7, len: 0.045, rate: rnd(0.9, 1.2),
         vol: 0.006 + 0.005 * (near || 0)});
}
/* the ball in the water bottle, and a small lick */
function sndSip(){
  if (!audioOn || !audioTouched) return;
  var ac = actx(); if (!ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(rnd(1500, 1900), t);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.014, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  o.connect(lp); lp.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.05);
  burst({freq: 900, q: 0.7, len: 0.05, vol: 0.01, type: 'lowpass'});
}
/* the slow breath of a sleeping piggy: a long, soft swell */
function sndSnore(){
  if (!audioOn || !audioTouched) return;
  var ac = actx(); if (!ac) return;
  var t = ac.currentTime, len = 0.62;
  var src = noiseSource(ac);
  src.playbackRate.value = 0.55;
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(340, t);
  lp.frequency.linearRampToValueAtTime(220, t + len);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.02, t + 0.22);       // breathe in
  g.gain.exponentialRampToValueAtTime(0.0001, t + len); // and out
  src.connect(lp); lp.connect(g); g.connect(ac.destination);
  src.start(t); src.stop(t + len + 0.05);
}

/* a soft crunch of cabbage */
function sndMunch(){
  burst({freq: rnd(600, 1000), q: 0.8, len: 0.075, rate: rnd(0.8, 1.1), vol: 0.024});
}

/* one small clock drives all three, reading whatever each piggy is doing */

/* ====================== the letter in the corner ======================
   English letters with their names read in Kannada, taken from the
   akka alphabet lesson. The Kannada spelling is how the letter's NAME
   sounds — it is not the matching Kannada letter. */
const LETTERS = [
  ['A','ಏ','APPLE','ಆ್ಯಪಲ್'],      ['B','ಬೀ','BALL','ಬಾಲ್'],
  ['C','ಸೀ','CAT','ಕ್ಯಾಟ್'],        ['D','ಡೀ','DOG','ಡಾಗ್'],
  ['E','ಈ','EGG','ಎಗ್'],            ['F','ಎಫ್','FISH','ಫಿಶ್'],
  ['G','ಜೀ','GOAT','ಗೋಟ್'],        ['H','ಏಚ್','HAT','ಹ್ಯಾಟ್'],
  ['I','ಐ','ICE','ಐಸ್'],            ['J','ಜೇ','JUG','ಜಗ್'],
  ['K','ಕೇ','KITE','ಕೈಟ್'],         ['L','ಎಲ್','LION','ಲಯನ್'],
  ['M','ಎಮ್','MANGO','ಮ್ಯಾಂಗೋ'],   ['N','ಎನ್','NEST','ನೆಸ್ಟ್'],
  ['O','ಓ','ORANGE','ಆರೆಂಜ್'],      ['P','ಪೀ','PEN','ಪೆನ್'],
  ['Q','ಕ್ಯೂ','QUEEN','ಕ್ವೀನ್'],    ['R','ಆರ್','ROSE','ರೋಸ್'],
  ['S','ಎಸ್','SUN','ಸನ್'],          ['T','ಟೀ','TREE','ಟ್ರೀ'],
  ['U','ಯೂ','UMBRELLA','ಅಂಬ್ರೆಲಾ'], ['V','ವೀ','VAN','ವ್ಯಾನ್'],
  ['W','ಡಬ್ಲ್ಯೂ','WATCH','ವಾಚ್'],   ['X','ಎಕ್ಸ್','X-RAY','ಎಕ್ಸ್-ರೇ'],
  ['Y','ವೈ','YO-YO','ಯೋ-ಯೋ'],      ['Z','ಝೆಡ್','ZEBRA','ಝೀಬ್ರಾ']
];
/* Words for things that are right there in the box, so the letter is tied to
   something the reader can see and point at. These Kannada words are
   translations (not the sound of the English word) — easy to change if any
   reads oddly. */
const SCENE = {
  C:['carrot','ಗಜ್ಜರಿ'], W:['water','ನೀರು'],   H:['hay','ಹುಲ್ಲು'],
  B:['box','ಪೆಟ್ಟಿಗೆ'],  N:['nest','ಗೂಡು'],    P:['pig','ಹಂದಿ'],
  L:['leaf','ಎಲೆ'],       G:['green','ಹಸಿರು'],  F:['food','ಆಹಾರ'],
  E:['eat','ತಿನ್ನು']
};
/* Teaching order, not A-B-C. The ten letters whose word is visible in the box
   come first, then the rest — and either way the pairs beginners mix up stay
   well apart (B and D, P and Q, M and W, I and L and J, N and U). Capitals run
   all the way through first, then the same order again in small letters. */
const ORDER = ['C','W','T','P','H','E','L','B','G','F',
               'A','S','O','M','I','N','R','K','D','U','J','V','Q','X','Y','Z'];
const card = document.getElementById('letterCard');
let orderPos = 0, smallCase = false, lastPigRead = 0;
const recent = [];                       // the last few letters she has seen
function paintLetter(tell){
  const en = ORDER[orderPos];
  const row = LETTERS.find(r => r[0] === en);
  const shown = smallCase ? en.toLowerCase() : en;
  // something in the box if we have it, otherwise the word from the lesson
  const scene = SCENE[en];
  const base = (scene ? scene[0] : row[2]).toLowerCase();
  const wordKn = scene ? scene[1] : row[3];
  // the word starts with the same letter in the same case, picked out in red
  const word = smallCase ? base : base[0].toUpperCase() + base.slice(1);
  document.getElementById('lBig').textContent = shown;
  document.getElementById('lKn').textContent = row[1];
  document.getElementById('lWord').innerHTML =
    '<b>' + word[0] + '</b>' + word.slice(1) + ' · ' + wordKn;
  card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
  if (tell) say(`${shown} is “${row[1]}”. Like ${word} — ${wordKn}.`, true);
  recent.unshift({shown, kn:row[1], word, wordKn});
  recent.splice(8);                       // keep the last eight
}
function nextLetter(tell){
  orderPos++;
  if (orderPos >= ORDER.length){ orderPos = 0; smallCase = !smallCase; }  // A-Z, then a-z
  paintLetter(tell);
}

/* ============================ refill timers ============================ */
/* each food needs a moment before you can put the same thing in again — long
   enough that trying the other two is the natural thing to do */
const COOLDOWN = {cabbage:42000, cucumber:42000, carrot:42000, clean:50000};
const readyAt = {};
document.querySelectorAll('.item').forEach(b => {
  const i = document.createElement('i'); i.className = 'cd'; b.appendChild(i);
});
function cdKey(btn){ return btn.dataset.kind || (btn.id === 'btnClean' ? 'clean' : null); }
function cooling(key){ return key && Date.now() < (readyAt[key] || 0); }
function leftSec(key){ return Math.ceil(((readyAt[key] || 0) - Date.now())/1000); }
function startCooldown(key){ if (COOLDOWN[key]) readyAt[key] = Date.now() + COOLDOWN[key]; }
setInterval(()=>{
  document.querySelectorAll('.item').forEach(btn => {
    const key = cdKey(btn);
    if (!key) return;
    const on = cooling(key);
    btn.classList.toggle('cooling', on);
    const badge = btn.querySelector('.cd');
    if (badge) badge.textContent = on ? leftSec(key) + 's' : '';
  });
}, 350);
function refuse(key){
  const others = ['cabbage','cucumber','carrot']
    .filter(k => k !== key && !cooling(k));
  say(key === 'clean'
      ? `The box is clean. Wait ${leftSec(key)}s.`
      : (others.length ? `More ${key} in ${leftSec(key)}s. Try ${others.join(' or ')}.`
                       : `More ${key} in ${leftSec(key)}s.`), true);
}

/* ====================== the bonus quiz ======================
   Now and then a quiz slip appears: an English letter (capital or small) or a
   word from the box, with two or three answers in Kannada. Get it right and
   the food is filled and the box swept clean. Get it wrong and it simply asks
   something else, until one lands. */
const quizEl = document.getElementById('quiz');
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
let quizOpen = false, lastQuiz = 0;

function makeQuestion(){
  // ask about the letters she has actually seen on the paper just now, with the
  // other choices taken from the same handful so nothing comes out of nowhere
  if (recent.length >= 3){
    const seen = shuffle(recent.slice());
    const it = seen[0];
    const askWord = Math.random() < .45;
    if (askWord){
      const wrong = seen.filter(r => r.wordKn !== it.wordKn).slice(0, 2).map(r => r.wordKn);
      if (wrong.length === 2)
        return {askKn: 'ಈ ಪದ ಯಾವುದು?', ask: 'Which one is this word?', big: it.word,
                right: it.wordKn, opts: shuffle([it.wordKn, ...wrong])};
    }
    const wrong = seen.filter(r => r.kn !== it.kn).slice(0, 2).map(r => r.kn);
    if (wrong.length === 2){
      const isSmall = /[a-z]/.test(it.shown);
      return {askKn: isSmall ? 'ಈ ಸಣ್ಣ ಅಕ್ಷರದ ಹೆಸರು ಯಾವುದು?' : 'ಈ ಅಕ್ಷರದ ಹೆಸರು ಯಾವುದು?',
              ask: isSmall ? 'What is this small letter called?' : 'What is this letter called?',
              big: it.shown, right: it.kn, opts: shuffle([it.kn, ...wrong])};
    }
  }
  // not enough seen yet: fall back to the lesson list
  const row = pick(LETTERS);
  const small = Math.random() < .5;
  const wrong = shuffle(LETTERS.filter(r => r[1] !== row[1])).slice(0, 2).map(r => r[1]);
  return {askKn: small ? 'ಈ ಸಣ್ಣ ಅಕ್ಷರದ ಹೆಸರು ಯಾವುದು?' : 'ಈ ಅಕ್ಷರದ ಹೆಸರು ಯಾವುದು?',
          ask: small ? 'What is this small letter called?' : 'What is this letter called?',
          big: small ? row[0].toLowerCase() : row[0],
          right: row[1], opts: shuffle([row[1], ...wrong])};
}

function askQuiz(){
  lastQuiz = Date.now();                              // the clock starts when it opens
  const q = makeQuestion();
  document.getElementById('qAskKn').textContent = q.askKn;
  document.getElementById('qAsk').textContent = q.ask;
  document.getElementById('qBig').textContent = q.big;
  const box = document.getElementById('qOpts');
  box.innerHTML = '';
  q.opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'qopt'; b.type = 'button'; b.textContent = opt;
    b.addEventListener('click', ()=>{
      if (opt === q.right){
        b.classList.add('right');
        setTimeout(()=>quizWon(), 420);
      } else {
        b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
        b.style.opacity = .45; b.disabled = true;
        document.getElementById('qAskKn').textContent = 'ಇನ್ನೊಮ್ಮೆ ನೋಡಿ';
        document.getElementById('qAsk').textContent = 'Try another one';
        setTimeout(()=>askQuiz(), 800);              // ask something else
      }
    });
    box.appendChild(b);
  });
  quizEl.classList.add('show');
  quizOpen = true;
}

/* ============================ layout ============================ */
let lastW = 0, lastH = 0;
function relayout(force){
  measure();
  if (FW < 60) return;
  if (force !== true && FW === lastW && Math.abs(FH - lastH) < FH*0.2) return;
  lastW = FW; lastH = FH;
  fitNests();                               // houses sized from the animals
  layoutProps();
  const w = pigWidth();                     // re-fit the piggies to the box
  HERD.forEach(p => { p.opts.width = w; p.el.style.width = w + 'px'; });
  crumbs.forEach(c => {
    c.x = clamp(c.x, FW*0.06, FW*0.94);
    const t = `translate(${c.x}px, ${-c.y}px) translateX(-50%) scale(${scaleAt(c.y)})`;
    c.el.style.setProperty('--t', t); c.el.style.transform = t;
  });
  HERD.forEach(p => {
    p.clear();
    p.y = clamp(atDepth(p.fd), yNear, yFar);
    p.x = p.clampX(p.fx*FW, p.y);
    p.render(true);
    p.think();
  });
}

/* ============================ add to home screen ============================ */
(function installable(){
  const btn = document.getElementById('btnInstall');
  const sheet = document.getElementById('sheet');
  const how = document.getElementById('sheetHow');
  const standalone = matchMedia('(display-mode: standalone)').matches ||
                     matchMedia('(display-mode: fullscreen)').matches ||
                     navigator.standalone === true;
  if (standalone){ btn.classList.add('hide'); return; }   // already an app on this phone

  const ua = navigator.userAgent;
  const iOS = /iphone|ipad|ipod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(ua);
  const firefox = /firefox|fxios/i.test(ua);

  let prompter = null;                       // Chrome hands us one of these when it can
  const waiting = [];
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); prompter = e;
    while (waiting.length) waiting.pop()(e);
  });
  // Chrome sometimes fires that event a beat after load, so give it a moment
  // before falling back to talking the user through the menu
  const getPrompter = () => prompter ? Promise.resolve(prompter) : new Promise(res => {
    const t = setTimeout(()=>res(null), 1200);
    waiting.push(e => { clearTimeout(t); res(e); });
  });
  const label = btn.innerHTML;               // keep the button looking identical after a tap

  btn.addEventListener('click', async () => {
    if (!prompter && !iOS){
      btn.textContent = '\u2026';
      await getPrompter();
      btn.innerHTML = label;
    }
    if (prompter){                            // the real one-tap install
      prompter.prompt();
      const res = await prompter.userChoice.catch(()=>null);
      prompter = null;
      if (res && res.outcome === 'accepted') btn.classList.add('hide');
      return;
    }
    how.innerHTML = iOS
      ? 'In Safari, tap <b>Share</b> at the bottom. Then pick <b>Add to Home Screen</b>.'
      : android
        ? (firefox
            ? 'Tap the <b>⋮</b> menu, then <b>Install</b>.'
            : 'Tap the <b>⋮</b> menu at the top right. Then tap <b>Add to Home screen</b>. It opens like a real app.')
        : 'Open your browser menu and look for <b>Install</b> or <b>Add to Home screen</b>.';
    sheet.classList.add('show');
  });
  document.getElementById('sheetOk').addEventListener('click', ()=>sheet.classList.remove('show'));
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('show'); });
  addEventListener('appinstalled', ()=>{
    btn.classList.add('hide');
    say('They are on your home screen now! 🏠', true);
  });
})();

var APP_VERSION = 'v2';
console.log('Lalu & Peelu ' + APP_VERSION);

/* The first version of this lived at /lalu-peelu.html with a worker scoped to
   the WHOLE site, which means it can still intercept this page on a device
   that installed it. Clear out anything that is not ours before registering,
   so an old tablet lets go of the stale copy instead of serving it forever. */
function shedOldVersions(){
  if (!('serviceWorker' in navigator)) return Promise.resolve();
  var mine = new URL('./', location.href).href;
  return navigator.serviceWorker.getRegistrations().then(function (regs){
    return Promise.all(regs.map(function (r){
      if (r.scope !== mine){                       // a worker from the old layout
        console.log('removing old worker at', r.scope);
        return r.unregister();
      }
    }));
  }).then(function (){
    if (!window.caches || !caches.keys) return;
    return caches.keys().then(function (keys){
      return Promise.all(keys.map(function (k){
        if (k.indexOf('lalu-' + APP_VERSION) !== 0){
          console.log('dropping old cache', k);
          return caches.delete(k);
        }
      }));
    });
  }).catch(function (){});
}

/* Save the whole box on the phone, so it still works with no internet.
   This is also what lets Chrome on Android offer "Add to home screen". */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  const hadWorker = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    // a newer version took over: pick it up once, never in a loop
    if (hadWorker && !reloaded){ reloaded = true; location.reload(); }
  });
  addEventListener('load', ()=>{
    shedOldVersions().then(()=>
    navigator.serviceWorker.register('./sw.js?v=2').then(()=>{
      if (!hadWorker) setTimeout(()=>say('Saved. It works with no internet now. 📴'), 2500);
    }).catch(()=>{}));
  });
}
