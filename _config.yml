plugins:
  - jekyll-sitemap
exclude:
  # Maintenance notes, not a page. Without this Jekyll renders it at
  # /assets/papers/ and jekyll-sitemap submits it for indexing.
  - scripts
  - assets/papers/README.md

# Keep binaries and the Search Console token out of the sitemap. A sitemap
# should list pages worth ranking, not every file the site happens to serve.
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "google726ad1c5405f8a99.html"
    values:
      sitemap: false
  - scope:
      path: "llms.txt"
    values:
      sitemap: false
  - scope:
      path: "publications.json"
    values:
      sitemap: false
calendar: https://calendly.com/kmarkiv/vikram
position: Postdoctoral Fellow
remote_theme: yaoyao-liu/minimal-light
# Direct, not a shortener: bit.ly only redirected here anyway, and the hop
# cost a round trip, put a third party in front of every CV click, and broke
# whenever bit.ly did.
cv_link: /assets/Vikram_Kamath_CV.pdf
thesis_link: https://kilthub.cmu.edu/articles/thesis/DIA_Supporting_Teacher_Professional_Development_in_Low_Infrastructure_Settings/25135118?file=44377391

