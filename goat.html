<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fae6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pip's Paddock</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--sky1:#9ed4ea;--sky2:#cfe9f0;--sky3:#e4eedd;--dim:rgba(10,20,45,0);--sway:3.4s;
        --ink:#2f3a28;--inkglow:rgba(255,255,255,.66)}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
    background:#9fd0e6;color:#3d4436;user-select:none;touch-action:manipulation;position:relative;
  }

  /* ---------------- sky + woods ---------------- */
  .sky{position:absolute;inset:0 0 62% 0;overflow:hidden;z-index:1;
    background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--sky3));
    transition:background 4s linear}
  .sun{position:absolute;width:56px;height:56px;border-radius:50%;margin:-28px 0 0 -28px;
    background:radial-gradient(circle at 40% 40%,#fffbe0,#ffe98d);
    box-shadow:0 0 55px 16px rgba(255,233,141,.4);
    transition:left 60s linear,top 60s linear,opacity 4s,box-shadow 4s,background 4s}
  .moon{position:absolute;width:42px;height:42px;border-radius:50%;margin:-21px 0 0 -21px;opacity:0;
    background:radial-gradient(circle at 36% 32%,#fffdf4,#e7e4d0);
    box-shadow:0 0 26px 9px rgba(255,253,235,.3);transition:opacity 4s,left 60s linear,top 60s linear}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
    opacity:0;transition:opacity 4s;z-index:0}
  .sun,.moon{z-index:0}
  .cloud,.bow{z-index:1}
  .woods{z-index:2}
  .bank{z-index:3}
  .bigtree{z-index:4}
  .dim{position:absolute;inset:0;pointer-events:none;z-index:15;
    background:var(--dim);transition:background 4s linear}
  .rain{position:absolute;inset:0;pointer-events:none;z-index:14;opacity:0;transition:opacity 2s}
  .drop{position:absolute;width:1.5px;height:15px;border-radius:1px;
    background:linear-gradient(rgba(220,235,255,0),rgba(224,238,255,.7));
    animation:fall linear infinite}
  @keyframes fall{from{transform:translateY(-14vh) rotate(9deg)}to{transform:translateY(114vh) rotate(9deg)}}
  .bow{position:absolute;left:50%;top:8%;width:104%;transform:translateX(-50%);
    opacity:0;transition:opacity 3s;pointer-events:none}
  .cloud{position:absolute;height:17px;background:#fff;border-radius:20px;opacity:.85;
    animation:drift linear infinite}
  .cloud::before{content:"";position:absolute;left:24%;top:-8px;width:44%;height:19px;
    background:#fff;border-radius:50%}
  @keyframes drift{from{transform:translateX(-45vw)}to{transform:translateX(145vw)}}

  .woods{position:absolute;left:-4%;right:-4%;bottom:17%;height:34%;
    background:linear-gradient(#4f8244,#3f6f3a)}
  .blob{position:absolute;border-radius:50%;background:#4d7f42}
  .bank{position:absolute;left:-4%;right:-4%;bottom:0;height:20%;
    background:linear-gradient(#7cad5c,#96c26e);
    border-radius:50% 50% 0 0/34% 34% 0 0;box-shadow:inset 0 4px 10px rgba(0,0,0,.08)}
  .birch{position:absolute;bottom:22%;width:5px;border-radius:2px;
    background:linear-gradient(90deg,#c6cabe,#f0f0e6 45%,#aeb5a6);opacity:.9}
  .birch i{position:absolute;left:0;width:100%;height:2px;background:#5a5a52;opacity:.5;
    border-radius:2px}
  .bankprop{position:absolute;transform-origin:50% 100%}

  /* the big oak: upper half lives in the sky, lower half in the paddock */
  .bigtree{position:absolute;bottom:0;height:100%;width:0}
  .trunk-hi{position:absolute;bottom:0;left:0;width:30px;margin-left:-15px;height:78%;
    background:linear-gradient(90deg,#5b4632,#8a6f4f 42%,#4d3b2a);border-radius:3px;
    clip-path:polygon(22% 0,78% 0,100% 62%,100% 100%,0 100%,0 62%)}
  .trunk-hi::after{content:"";position:absolute;inset:0;opacity:.4;border-radius:3px;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px)}
  .branch{position:absolute;height:7px;background:#5b4632;border-radius:6px;transform-origin:left center}
  .leaf{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#5f9c52,#3d7238);opacity:.96}

  /* ---------------- paddock ---------------- */
  .field{position:absolute;left:0;right:0;bottom:0;height:62%;overflow:hidden;z-index:5;
    background:radial-gradient(120% 90% at 50% 130%,#9dc97a 0%,#87b768 50%,#6fa257 100%);
    box-shadow:inset 0 6px 14px rgba(0,0,0,.10)}
  .field::before{content:"";position:absolute;inset:0;opacity:.14;
    background-image:repeating-linear-gradient(94deg,rgba(255,255,255,.18) 0 2px,transparent 2px 10px)}

  /* gravel yard in the foreground */
  .yard{position:absolute;left:-8%;right:-8%;bottom:0;height:47%;z-index:3;
    border-radius:50% 50% 0 0/24% 24% 0 0;
    background-color:#a89e8e;
    background-image:
      radial-gradient(rgba(86,74,58,.20) .9px,transparent 1.3px),
      radial-gradient(rgba(255,255,255,.16) .9px,transparent 1.3px),
      radial-gradient(rgba(128,112,90,.18) 1.4px,transparent 2px),
      linear-gradient(#b0a695,#94896f);
    background-size:11px 11px,15px 15px,26px 26px,100% 100%;
    background-position:0 0,5px 7px,9px 3px,0 0;
    box-shadow:inset 0 5px 14px rgba(0,0,0,.10)}
  .yard::before{content:"";position:absolute;left:0;right:0;top:-7px;height:16px;
    border-radius:50%;background:rgba(96,124,64,.35);filter:blur(4px)}

  /* back fence */
  .fence{position:absolute;left:-2%;top:0;width:104%;height:34px;pointer-events:none;z-index:1}
  .rail{position:absolute;left:0;width:100%;height:6px;background:#b08a5e;
    border-top:2px solid #d3b189;border-bottom:2px solid #8f6c44;border-radius:2px}
  .rail.r1{top:4px}.rail.r2{top:17px}
  .post{position:absolute;top:-4px;width:8px;height:32px;background:#a3805a;
    border-radius:2px 2px 0 0;border-left:2px solid #c39d70;border-right:2px solid #82613f}

  .prop,.tuft,.hay{position:absolute;left:0;bottom:0}
  .prop{transform-origin:50% 100%;pointer-events:none}
  .tuft{transform-origin:50% 100%;animation:sway var(--sway) ease-in-out infinite}
  @keyframes sway{0%,100%{transform:var(--t) rotate(-4deg)}50%{transform:var(--t) rotate(5deg)}}

  /* ---------------- animals ---------------- */
  .goat{position:absolute;left:0;bottom:0;width:200px;transform-origin:50% 100%;
    will-change:transform;cursor:pointer}
  .goat .shadow{position:absolute;left:50%;bottom:6px;width:60%;height:15px;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(35,45,25,.45),rgba(35,45,25,0));border-radius:50%}
  .flip{transform-origin:50% 100%}
  .flip.left{transform:scaleX(-1)}
  .gsvg{width:100%;height:auto;display:block;overflow:visible}

  .up,.lo,.neck,.tail{transform-box:view-box}
  .jaw,.ear,.lid{transform-box:fill-box}
  .jaw{transform-origin:8% 45%}
  .ear{transform-origin:100% 60%}
  .lid{transform-origin:50% 50%}
  .up,.lo{transform-origin:0 0}
  .neck{transform-origin:0 0;transition:transform .75s cubic-bezier(.4,0,.3,1)}
  .torso{transition:transform .6s ease}

  .goat{--gait:.66s}
  .walking .lg.a .up{animation:legUpF var(--gait) linear infinite}
  .walking .lg.b .up{animation:legUpF var(--gait) linear infinite;animation-delay:calc(var(--gait)*-.5)}
  .walking .lg.a.f .lo{animation:legLoF var(--gait) linear infinite}
  .walking .lg.b.f .lo{animation:legLoF var(--gait) linear infinite;animation-delay:calc(var(--gait)*-.5)}
  .walking .lg.a.h .lo{animation:legLoH var(--gait) linear infinite}
  .walking .lg.b.h .lo{animation:legLoH var(--gait) linear infinite;animation-delay:calc(var(--gait)*-.5)}
  @keyframes legUpF{0%{transform:rotate(19deg)}50%{transform:rotate(-17deg)}100%{transform:rotate(19deg)}}
  @keyframes legLoF{0%{transform:rotate(-3deg)}28%{transform:rotate(-27deg)}62%{transform:rotate(1deg)}100%{transform:rotate(-3deg)}}
  @keyframes legLoH{0%{transform:rotate(4deg)}28%{transform:rotate(26deg)}62%{transform:rotate(-2deg)}100%{transform:rotate(4deg)}}
  .walking .torso{animation:bob var(--gait) ease-in-out infinite;transition:none}
  @keyframes bob{0%,100%{transform:translateY(0)}25%,75%{transform:translateY(-2.5px)}}
  .walking .neck{animation:nod var(--gait) ease-in-out infinite;transition:none}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}

  .grazing .neck{transform:translate(16px,24px) rotate(74deg)}
  .grazing .torso{transform:translateY(3px)}
  .grazing .jaw{animation:chew .3s ease-in-out infinite}
  .drinking .neck{transform:translate(14px,26px) rotate(78deg)}
  .feeding .neck{transform:translate(10px,6px) rotate(34deg)}
  .feeding .jaw{animation:chew .3s ease-in-out infinite}
  .perk .neck{transform:rotate(-15deg)}
  .chewing .jaw{animation:chew .34s ease-in-out infinite}
  @keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}

  .tail{transform-origin:80px 100px;animation:wag 1.5s ease-in-out infinite}
  .perk .tail,.happy .tail{animation-duration:.42s}
  @keyframes wag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(14deg)}}
  .ear{animation:flick 5.5s ease-in-out infinite}
  @keyframes flick{0%,90%,100%{transform:rotate(0)}95%{transform:rotate(-14deg)}}
  .lid{transform:scaleY(0)}
  .blink .lid{animation:blink .2s ease-in-out}
  @keyframes blink{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
  .hopper{transform-origin:50% 100%}
  .happy .hopper{animation:hop .55s ease-in-out}
  @keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-15px)}70%{transform:translateY(0)}}

  .bubble{position:absolute;left:50%;bottom:86%;padding:6px 11px;background:#fff;border-radius:14px;
    font-size:15px;font-weight:600;white-space:nowrap;opacity:0;transform:translate(-50%,6px);
    box-shadow:0 3px 8px rgba(0,0,0,.16);transition:opacity .25s,transform .25s}
  .bubble::after{content:"";position:absolute;left:50%;margin-left:-7px;bottom:-6px;
    border:7px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble.show{opacity:1;transform:translate(-50%,0)}

  .hay{transform-origin:50% 100%;pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.22));animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes drop{0%{transform:var(--t) translateY(-170px) rotate(-25deg)}100%{transform:var(--t)}}

  /* ---------------- UI ---------------- */
  header{position:absolute;top:0;left:0;right:0;z-index:20;text-align:center;
    padding:calc(9px + env(safe-area-inset-top)) 10px 0}
  h1{margin:0;font-size:1.28rem;letter-spacing:.4px;color:var(--ink);
    text-shadow:0 1px 3px var(--inkglow);transition:color 4s,text-shadow 4s}
  .mood{margin:3px 0 0;font-size:.88rem;opacity:.88;min-height:1.2em;color:var(--ink);
    text-shadow:0 1px 3px var(--inkglow);transition:color 4s,text-shadow 4s}
  .hearts{margin-top:4px;font-size:.92rem;letter-spacing:2px}

  .controls{position:absolute;bottom:0;left:0;right:0;z-index:20;
    display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
    padding:10px 8px calc(13px + env(safe-area-inset-bottom))}
  button{border:0;border-radius:999px;padding:11px 12px;font:inherit;font-weight:650;font-size:.86rem;
    background:rgba(255,255,255,.95);color:#3d4436;box-shadow:0 4px 0 rgba(0,0,0,.15);
    transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}

  .float{position:fixed;pointer-events:none;font-size:1.55rem;z-index:30;
    animation:rise 1.25s ease-out forwards}
  @keyframes rise{0%{opacity:1;transform:translate(-50%,0) scale(.5)}
    100%{opacity:0;transform:translate(-50%,-100px) scale(1.35)}}

  @media (prefers-reduced-motion:reduce){.cloud,.tuft,.tail,.ear{animation:none}}
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="sun" id="sun"></div>
  <div class="moon" id="moon"></div>
  <svg class="bow" id="bow" viewBox="0 0 400 140">
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path d="M20 140 A180 180 0 0 1 380 140" stroke="#ff8a7a"/>
      <path d="M32 140 A168 168 0 0 1 368 140" stroke="#ffc46b"/>
      <path d="M44 140 A156 156 0 0 1 356 140" stroke="#fff08a"/>
      <path d="M56 140 A144 144 0 0 1 344 140" stroke="#8fe08a"/>
      <path d="M68 140 A132 132 0 0 1 332 140" stroke="#84c8f5"/>
      <path d="M80 140 A120 120 0 0 1 320 140" stroke="#b79bf0"/>
    </g>
  </svg>
  <div class="woods" id="woods"></div>
</div>
<div class="rain" id="rain"></div>
<div class="dim"></div>

<header>
  <h1>Pip, Nutmeg &amp; Clover 🐐</h1>
  <p class="mood" id="mood">Tap the ground and they'll wander over.</p>
  <div class="hearts" id="hearts">🤍🤍🤍🤍🤍</div>
</header>

<div class="field" id="field">
  <div class="fence" id="fence"><div class="rail r1"></div><div class="rail r2"></div></div>
  <div class="yard"></div>
</div>

<div class="controls">
  <button id="btnHay">🌾 Hay</button>
  <button id="btnWater">💧 Water</button>
  <button id="btnCall">📣 Call</button>
  <button id="btnWeather">🌦️ Sky</button>
</div>

<script>
const field  = document.getElementById('field');
const moodEl = document.getElementById('mood');
const heartsEl = document.getElementById('hearts');
const rnd  = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ============ depth: y = px above the paddock's bottom edge ============ */
let FW=0, FH=0, yNear=0, yFar=0;
function measure(){
  // never trust a zero / impossibly small reading (happens while a phone rotates
  // or the page is still laying out) — keep the last good one instead
  const w = field.clientWidth || innerWidth || 0;
  const h = field.clientHeight || innerHeight*0.62 || 0;
  if (w > 80 && h > 80){
    FW = w; FH = h;
    yNear = FH*0.23; yFar = FH*0.80;
  }
}
measure();
const depth   = y => (y - yNear) / Math.max(1, yFar - yNear);
const scaleAt = y => 1 - 0.52*Math.min(1, Math.max(0, depth(y)));
const atDepth = d => yNear + d*(yFar - yNear);

const props = [];
function placeProp(el, fx, fd, extra){
  const y = atDepth(fd), s = scaleAt(y)*(extra||1);
  const t = `translate(${fx*FW}px, ${-y}px) translateX(-50%) scale(${s})`;
  el.style.setProperty('--t', t);
  el.style.transform = t;
  el.style.zIndex = Math.round(900 - y);
}
function layoutProps(){ props.forEach(p => placeProp(p.el, p.fx, p.fd, p.extra)); }

/* where things live in the pen */
const SPOTS = {
  trough  :{fx:.16, fd:.46},
  feeder  :{fx:.58, fd:.83},
  shelterA:{fx:.30, fd:.90},
  shelterB:{fx:.90, fd:.79},
  platform:{fx:.10, fd:.86},
  tree    :{fx:.80, fd:1.00}
};
const spot = k => ({x: SPOTS[k].fx*FW, y: atDepth(SPOTS[k].fd)});
const PLATFORM_LIFT = 34;

/* ============ scenery ============ */
function addProp(fx, fd, html, extra){
  const d = document.createElement('div');
  d.className = 'prop'; d.innerHTML = html;
  field.appendChild(d);
  props.push({el:d, fx, fd, extra});
  return d;
}

(function sky(){
  const skyEl = document.getElementById('sky'), woods = document.getElementById('woods');
  for (let i=0;i<4;i++){
    const c = document.createElement('div'); c.className='cloud';
    const dur = rnd(40,75);
    c.dataset.dur = dur;
    Object.assign(c.style,{width:rnd(56,110)+'px',top:rnd(4,24)+'%',
      animationDuration:dur+'s',animationDelay:(-rnd(0,55))+'s'});
    skyEl.appendChild(c);
  }
  for (let i=0;i<44;i++){                                  // stars, for after dark
    const s=document.createElement('div'); s.className='star';
    Object.assign(s.style,{left:rnd(1,99)+'%',top:rnd(1,62)+'%',
      width:rnd(1.4,2.6)+'px',height:rnd(1.4,2.6)+'px'});
    skyEl.appendChild(s);
  }
  // a soft, blobby treeline
  for (let i=0;i<=20;i++){
    const b = document.createElement('div'); b.className='blob';
    const w = rnd(38,84);
    Object.assign(b.style,{width:w+'px',height:w*rnd(.62,.92)+'px',
      left:(i/20*100)+'%',top:(-w*rnd(.3,.6))+'px',marginLeft:(-w/2)+'px',
      background:pick(['#4d7f42','#456f3d','#548a48','#3f6f3a','#5c9450'])});
    woods.appendChild(b);
  }

  // the grassy bank in front of the wood, with birches, logs and ferns
  const bank = document.createElement('div'); bank.className='bank';
  skyEl.appendChild(bank);
  for (let i=0;i<11;i++){
    const t = document.createElement('div'); t.className='birch';
    Object.assign(t.style,{left:rnd(1,98)+'%',height:rnd(30,62)+'px',
      width:rnd(4,6)+'px',opacity:rnd(.55,.9),bottom:rnd(18,60)+'%'});
    for (let m=0;m<3;m++){
      const i2=document.createElement('i'); i2.style.top=rnd(12,80)+'%'; t.appendChild(i2);
    }
    bank.appendChild(t);
  }
  const bankProp = (html, left, bottom, s)=>{
    const d=document.createElement('div'); d.className='bankprop';
    d.innerHTML=html;
    Object.assign(d.style,{left:left+'%',bottom:bottom+'%',transform:`translateX(-50%) scale(${s})`});
    bank.appendChild(d);
  };
  const LOG = `<svg width="104" height="20" viewBox="0 0 104 20">
      <rect x="4" y="3" width="94" height="13" rx="6.5" fill="#dfded1"/>
      <rect x="4" y="3" width="94" height="6" rx="3" fill="#f3f3ea"/>
      <rect x="4" y="12" width="94" height="4" rx="2" fill="#c3c2b4" opacity=".8"/>
      <ellipse cx="97" cy="9.5" rx="5.5" ry="6.5" fill="#c9b79a"/>
      <ellipse cx="97" cy="9.5" rx="2.4" ry="3" fill="#a89272"/>
      <g fill="#6f6f63" opacity=".45"><rect x="26" y="6" width="8" height="2.4" rx="1.2"/>
        <rect x="52" y="9" width="9" height="2.4" rx="1.2"/><rect x="74" y="6" width="7" height="2.4" rx="1.2"/></g>
    </svg>`;
  const FERN = `<svg width="44" height="32" viewBox="0 0 44 32">
      <path d="M22 32 C10 28 4 18 3 6 C12 10 19 20 22 32 Z" fill="#3f7a3a"/>
      <path d="M22 32 C34 28 40 18 41 6 C32 10 25 20 22 32 Z" fill="#4a8c42"/>
      <path d="M22 32 C17 23 15 12 17 2 C23 10 25 21 22 32 Z" fill="#57a44c"/>
      <path d="M22 32 C27 23 29 12 27 2 C21 10 19 21 22 32 Z" fill="#468640"/></svg>`;
  bankProp(LOG, 22, 36, .85); bankProp(LOG, 76, 54, .6); bankProp(LOG, 50, 18, 1);
  [8,17,29,38,54,63,71,86,94].forEach(l => bankProp(FERN, l, rnd(6,62), rnd(.55,.95)));
  // the big oak — upper half
  const tree = document.createElement('div');
  tree.className='bigtree';
  tree.style.left = (SPOTS.tree.fx*100)+'%';
  tree.innerHTML = `<div class="trunk-hi"></div>`;
  [[-6,0,96,44],[46,4,110,50],[-58,10,104,46],[6,20,132,54],[-26,30,104,44],[64,26,92,40]]
    .forEach(([x,y,w,h])=>{
      const l=document.createElement('div'); l.className='leaf';
      Object.assign(l.style,{width:w+'px',height:h+'px',left:x+'px',top:y+'px',
        marginLeft:(-w/2)+'px'});
      tree.appendChild(l);
    });
  [[8,-14,70],[-8,-24,70],[10,-40,58]].forEach(([y,rot,len])=>{
    const b=document.createElement('div'); b.className='branch';
    Object.assign(b.style,{width:len+'px',top:(14+y)+'%',left:'0',
      transform:`rotate(${rot}deg)`});
    tree.appendChild(b);
  });
  skyEl.appendChild(tree);
})();

(function scenery(){
  // fence posts
  const fence = document.getElementById('fence');
  for (let i=0;i<=14;i++){
    const p=document.createElement('div'); p.className='post';
    p.style.left=(i/14*100)+'%'; fence.appendChild(p);
  }
  // side fence posts, receding
  for (const side of ['l','r'])
    for (let i=0;i<6;i++)
      addProp(side==='l' ? .012 : .988, .06+i*.19, `<svg width="16" height="56" viewBox="0 0 16 56">
        <rect x="4" y="0" width="9" height="56" rx="2" fill="#a3805a"/>
        <rect x="4" y="0" width="2.6" height="56" fill="#c39d70"/>
        <rect x="10.4" y="0" width="2.6" height="56" fill="#82613f"/>
        <rect x="0" y="12" width="16" height="5" fill="#b08a5e"/>
        <rect x="0" y="30" width="16" height="5" fill="#a3805a"/></svg>`);

  // a few ferns tucked against the back fence
  for (let i=0;i<7;i++)
    addProp(rnd(.04,.96), rnd(1.02,1.14), `<svg width="44" height="32" viewBox="0 0 44 32">
      <path d="M22 32 C10 28 4 18 3 6 C12 10 19 20 22 32 Z" fill="#3f7a3a"/>
      <path d="M22 32 C34 28 40 18 41 6 C32 10 25 20 22 32 Z" fill="#4a8c42"/>

/* ============ the sky follows your phone's clock ============ */
const SKY_KEYS = [   // by sun elevation: -1 = deep night … 1 = high noon
  {e:-1.0, s1:'#0d1b33', s2:'#16294a', s3:'#243a5e', dim:'rgba(8,16,38,.56)'},
  {e:-0.16,s1:'#2b4066', s2:'#6a6a90', s3:'#b98a7e', dim:'rgba(20,28,62,.34)'},
  {e: 0.05,s1:'#6f9fc8', s2:'#e8ab7d', s3:'#f6d2a2', dim:'rgba(90,55,30,.15)'},
  {e: 0.34,s1:'#9ed4ea', s2:'#cfe9f0', s3:'#e4eedd', dim:'rgba(0,0,0,0)'},
  {e: 1.0, s1:'#9ed4ea', s2:'#cfe9f0', s3:'#e4eedd', dim:'rgba(0,0,0,0)'}
];
const hex2rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixHex = (a,b,t)=>{ const A=hex2rgb(a),B=hex2rgb(b);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; };
const mixRgba = (a,b,t)=>{
  const p=s=>s.match(/[\d.]+/g).map(Number);
  const A=p(a),B=p(b);
  return `rgba(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},`+
         `${Math.round(A[2]+(B[2]-A[2])*t)},${(A[3]+(B[3]-A[3])*t).toFixed(3)})`;
};

function sunTimes(d){                       // rough but seasonal: long summer days, short winter ones
  const doy = Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5);
  const half = 6.15 + 2.05*Math.cos(2*Math.PI*(doy-172)/365);
  return {rise: 12.9-half, set: 12.9+half};
}
let nightFactor = 0;
function updateSky(){
  const now = new Date();
  const h = now.getHours() + now.getMinutes()/60;
  const {rise, set} = sunTimes(now);
  const t = (h - rise) / (set - rise);                 // 0 at sunrise, 1 at sunset
  const elev = Math.sin(Math.PI * Math.max(-.35, Math.min(1.35, t)));

  let i = 0; while (i < SKY_KEYS.length-2 && elev > SKY_KEYS[i+1].e) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i+1];
  const k = Math.max(0, Math.min(1, (elev - a.e)/(b.e - a.e)));
  const r = document.documentElement.style;
  r.setProperty('--sky1', mixHex(a.s1,b.s1,k));
  r.setProperty('--sky2', mixHex(a.s2,b.s2,k));
  r.setProperty('--sky3', mixHex(a.s3,b.s3,k));
  window.BASE_DIM = mixRgba(a.dim,b.dim,k);
  applyDim();

  nightFactor = Math.max(0, Math.min(1, (-elev + .06) * 3.2));
  document.querySelectorAll('.star').forEach(s => s.style.opacity = nightFactor*rnd(.55,1));
  r.setProperty('--ink', mixHex('#2f3a28', '#eef3ff', nightFactor));
  r.setProperty('--inkglow', nightFactor > .4
    ? `rgba(6,12,30,${(.55*nightFactor).toFixed(2)})` : 'rgba(255,255,255,.66)');

  const sun = document.getElementById('sun'), moon = document.getElementById('moon');
  const arc = (p) => ({ left:(6 + 88*p)+'%', top:(78 - 62*Math.sin(Math.PI*p))+'%' });
  const sp = arc(Math.max(0,Math.min(1,t)));
  Object.assign(sun.style, sp);
  sun.style.opacity = elev > -.05 ? 1 : 0;
  sun.style.background = elev < .25            // low sun turns warm
    ? 'radial-gradient(circle at 40% 40%,#fff3c8,#ffab63)'
    : 'radial-gradient(circle at 40% 40%,#fffbe0,#ffe98d)';
  // the moon takes the opposite half of the day
  const mt = h > set ? (h-set)/(24-(set-rise)) : (h + 24 - set)/(24-(set-rise));
  Object.assign(moon.style, arc(Math.max(0,Math.min(1,mt))));
  moon.style.opacity = nightFactor;
}
function applyDim(){
  document.documentElement.style.setProperty('--dim',
    window.WEATHER_DIM ? mixRgba(window.BASE_DIM||'rgba(0,0,0,0)', window.WEATHER_DIM, .8)
                       : (window.BASE_DIM||'rgba(0,0,0,0)'));
}
function greeting(){
  const h = new Date().getHours();
  return h < 6  ? 'The herd is dozing under the stars. 🌙'
       : h < 11 ? 'Morning in the paddock — everyone is hungry. 🌅'
       : h < 15 ? 'A lazy afternoon of chewing. ☀️'
       : h < 19 ? 'Golden hour on the hillside. 🌤️'
       : h < 22 ? 'Evening — they drift back to the shelters. 🌆'
       :          'Quiet night in the enclosure. 🌙';
}

/* ============ weather, every few minutes ============ */
const rainEl = document.getElementById('rain');
for (let i=0;i<52;i++){
  const d=document.createElement('div'); d.className='drop';
  Object.assign(d.style,{left:rnd(-4,102)+'%',animationDuration:rnd(.55,1.05)+'s',
    animationDelay:(-rnd(0,1.2))+'s',opacity:rnd(.35,.9)});
  rainEl.appendChild(d);
}
let WEATHER = 'clear';
function setWeather(w){
  const was = WEATHER;
  WEATHER = w;
  const clouds = document.querySelectorAll('.cloud');
  rainEl.style.opacity = w === 'rain' ? 1 : 0;
  document.documentElement.style.setProperty('--sway',
    w === 'wind' ? '1.1s' : w === 'rain' ? '2.2s' : '3.4s');
  clouds.forEach(c=>{
    const base = +c.dataset.dur || 55;
    c.style.animationDuration = (w==='wind' ? base*.32 : w==='rain' ? base*.6 : base)+'s';
    c.style.opacity = w==='clear' ? .85 : 1;
  });
  window.WEATHER_DIM = w==='rain'  ? 'rgba(40,55,80,.34)'
                     : w==='cloud' ? 'rgba(50,60,80,.14)'
                     : w==='wind'  ? 'rgba(50,60,80,.06)' : null;
  applyDim();
  if (w === 'rain'){
    say('Rain coming in — off to the shelters. 🌧️');
    HERD.forEach((g,i)=> setTimeout(()=>g.seekShelter(), i*rnd(500,1600)));
    return;
  }
  if (was === 'rain'){                      // shower over: back out to graze
    HERD.forEach((g,i)=>{ if (g.sheltering){ g.sheltering=false;
      setTimeout(()=>{ g.clear(); g.think(); }, i*700); } });
    if (nightFactor < .3) showRainbow();
  }
  if (w === 'wind')       say('A breeze rolls through the trees. 🍃');
  else if (w === 'cloud') say('Clouds drifting over the paddock. ☁️');
  else say(pick(['The sun is back out. ☀️','Calm again in the pen. 🌾','All quiet. 🐐']));
}
function showRainbow(){
  const bow = document.getElementById('bow');
  bow.style.opacity = .55;
  setTimeout(()=>bow.style.opacity = 0, 26000);
}
function runWeather(w, hold){                 // apply, then drift back to clear
  setWeather(w);
  if (w !== 'clear')
    setTimeout(()=>{ if (WEATHER === w) setWeather('clear'); }, hold);
}
function weatherTick(){
  const w = pick(['clear','clear','clear','cloud','cloud','wind','rain','rain']);
  if (w !== WEATHER) runWeather(w, rnd(45000, 100000));
  setTimeout(weatherTick, rnd(120000, 240000));
}

/* the weather button: one change, then a minute's cooldown */
const btnWeather = document.getElementById('btnWeather');
let cdEnd = 0, cdTimer = null;
function cooldownTick(){
  clearInterval(cdTimer);
  const upd = ()=>{
    const left = Math.ceil((cdEnd - Date.now())/1000);
    if (left <= 0){ clearInterval(cdTimer); btnWeather.textContent='🌦️ Sky';
      btnWeather.style.opacity=1; return; }
    btnWeather.textContent = '⏳ '+left+'s';
    btnWeather.style.opacity = .55;
  };
  upd(); cdTimer = setInterval(upd, 1000);
}
btnWeather.onclick = ()=>{
  if (Date.now() < cdEnd){
    say('The sky needs a moment… ⏳ '+Math.ceil((cdEnd-Date.now())/1000)+'s');
    return;
  }
  runWeather(pick(['clear','cloud','wind','rain'].filter(w=>w!==WEATHER)), rnd(60000,95000));
  cdEnd = Date.now() + 60000;
  cooldownTick();
};

     <g transform="translate(1,38)"><g class="lo">
       <circle cx="0" cy="0" r="6.4"/><rect x="-6" y="0" width="12" height="38" rx="6"/>
       <path d="M-6.4 33 h12.8 v9 q0 4 -6.4 4 q-6.4 0 -6.4 -4z" fill="${c.hoof}"/>
     </g></g></g></g></g>
 </g>
</svg>`;
}

const COATS = {
  pip   :{top:'#5b4c40',mid:'#7d6a57',belly:'#cdb99f',dark:'#443930',horn:'#57493c',hoof:'#332b25',face:'#cdb89c'},
  nutmeg:{top:'#96795a',mid:'#c2a179',belly:'#f3e7d2',dark:'#755d45',horn:'#63523f',hoof:'#43382d',face:'#f0e2c8'},
  clover:{top:'#77543a',mid:'#a37350',belly:'#e6d4bb',dark:'#5b3d28',horn:'#564636',hoof:'#3a2f24',face:'#e2cfb1'}
};

const LOVE={n:0};
function addLove(){
  LOVE.n=Math.min(5,LOVE.n+1);
  heartsEl.textContent='❤️'.repeat(LOVE.n)+'🤍'.repeat(5-LOVE.n);
  if (LOVE.n===5) say('The whole herd loves you now. 💞');
}
const say = t => moodEl.textContent = t;
function floatAt(x,y,emoji){
  const s=document.createElement('div'); s.className='float'; s.textContent=emoji;
  s.style.left=x+'px'; s.style.top=y+'px'; document.body.appendChild(s);
  setTimeout(()=>s.remove(),1250);
}

class Goat {
  constructor(id, coat, opts={}){
    this.id=id; this.opts=opts; this.name=opts.name;
    this.el=document.createElement('div');
    this.el.className='goat';
    this.el.style.width=(opts.width||200)+'px';
    // .hopper exists so the hop animation never touches the wrapper's own
    // position/scale transform — animating that would fling the animal to the corner
    this.el.innerHTML=`<div class="shadow"></div>`+
                      `<div class="hopper"><div class="flip">${goatSVG(id,coat,opts)}</div></div>`+
                      `<div class="bubble"></div>`;
    this.flip=this.el.querySelector('.flip');
    this.bubble=this.el.querySelector('.bubble');
    this.sizeMul=opts.sizeMul||1;
    this.speed=opts.speed||46;
    this.pitch=opts.pitch||1;
    this.lift=0;
    this.fx=opts.fx; this.fd=opts.fd;
    this.x=this.fx*FW; this.y=atDepth(this.fd); this.facing=1;
    field.appendChild(this.el);
    this.render(true);
    this.el.addEventListener('pointerdown', e=>{ e.stopPropagation(); this.pat(e); });
    this.el.addEventListener('transitionend', e=>{
      if (e.propertyName==='transform' && this.arrive){ const f=this.arrive; this.arrive=null; f(); }
    });
    setInterval(()=>{ this.el.classList.add('blink');
      setTimeout(()=>this.el.classList.remove('blink'),240); }, rnd(3200,5200));
    this.timer=setTimeout(()=>this.think(), 500);
  }
  render(instant){
    const s=scaleAt(this.y)*this.sizeMul;
    if (instant) this.el.style.transitionDuration='0s';
    this.el.style.transform=
      `translate(${this.x}px, ${-this.y}px) translateX(-50%) scale(${s}) translateY(${-this.lift}px)`;
    this.el.style.zIndex=Math.round(900-this.y);
  }
  syncFromDOM(){
    const f=field.getBoundingClientRect(), r=this.el.getBoundingClientRect();
    if (!f.width) return;
    this.x=r.left+r.width/2-f.left;
    this.y=f.bottom-r.bottom+this.lift*scaleAt(this.y)*this.sizeMul;
    this.mark();
  }
  mark(){ this.fx=this.x/Math.max(1,FW); this.fd=depth(this.y); }
  clampX(x,y){
    const m=Math.min(FW*0.4,(this.opts.width||200)*scaleAt(y)*this.sizeMul*0.38);
    return Math.max(m, Math.min(FW-m, x));
  }
  state(cls){
    this.el.classList.remove('walking','grazing','drinking','feeding','perk','chewing');
    if (cls) this.el.classList.add(cls);
  }
  clear(){ clearTimeout(this.timer); this.arrive=null; }
  bleat(text){                                  // silent: just a little speech bubble
    this.bubble.textContent=text; this.bubble.classList.add('show');
    clearTimeout(this._b); this._b=setTimeout(()=>this.bubble.classList.remove('show'),1800);
  }
  walkTo(x,y,then){
    // Pin the animal to where it actually IS before starting a new walk. Without
    // this, cutting a transition short snaps it to the spot it was heading for.
    this.syncFromDOM();
    this.el.style.transitionDuration='0s';
    this.render();
    void this.el.offsetWidth;

    y=Math.max(yNear, Math.min(yFar, y));
    x=this.clampX(x,y);
    const dx=x-this.x, dy=y-this.y, dist=Math.hypot(dx, dy*0.8);
    if (dist<6){ then&&then(); return; }
    if (Math.abs(dx)>3){ this.facing=dx<0?-1:1;
      this.flip.classList.toggle('left', this.facing===-1); }
    const dur=dist/(this.speed*scaleAt((this.y+y)/2));
    this.x=x; this.y=y; this.mark();
    this.state('walking');
    this.el.style.setProperty('--gait', Math.max(.38, Math.min(.8, 30/this.speed))+'s');
    this.el.style.transitionProperty='transform';
    this.el.style.transitionTimingFunction='cubic-bezier(.45,.05,.55,.95)';
    this.el.style.transitionDuration=dur+'s';
    this.render();
    this.arrive=()=>{ this.state(null); then&&then(); };
  }
  hold(cls, sec, then){
    this.state(cls);
    this.timer=setTimeout(()=>{ this.state(null); then&&then(); }, sec*1000);
  }
  pat(e){
    this.clear(); this.state('perk');
    this.el.classList.add('happy');
    setTimeout(()=>this.el.classList.remove('happy'),600);
    for(let i=0;i<4;i++) setTimeout(()=>floatAt(
      (e.clientX||0)+rnd(-26,26), (e.clientY||0)+rnd(-14,14), pick(['💗','✨','💚'])), i*90);
    this.bleat(pick(['maaa~','meh!','mmmh…','baaa!']));
    say(pick([`${this.name} leans into your hand.`, `${this.name} is very pleased.`,
      'Accepted into the herd. 🐐', `${this.name} would like that again, please.`]));
    addLove();
    if (navigator.vibrate) navigator.vibrate(16);
    // being petted never moves them — they settle down right where they are
    this.timer=setTimeout(()=>this.hold(Math.random()<.6?'grazing':'chewing', rnd(5,10),
      ()=>this.think()), 1700);
  }
  goEat(x,y,secs){
    this.clear();
    this.walkTo(x+rnd(-30,30), y+rnd(-8,8), ()=>this.hold('grazing', secs||6, ()=>this.think()));
  }
  seekShelter(){                               // when it rains, stand under a dome
    this.clear(); this.sheltering = true;
    this.syncFromDOM();
    const key = this.x < FW*.55 ? 'shelterA' : 'shelterB';
    const s = spot(key);
    this.walkTo(s.x+rnd(-46,46), s.y-rnd(2,16),
      ()=>this.hold('chewing', rnd(20,40), ()=>{ if (WEATHER==='rain') this.seekShelter();
                                                 else { this.sheltering=false; this.think(); } }));
  }
  climb(){                                     // goats love standing on things
    const p=spot('platform');
    this.walkTo(p.x, p.y, ()=>{
      this.lift=PLATFORM_LIFT;
      this.el.style.transitionTimingFunction='cubic-bezier(.3,1.4,.5,1)';
      this.el.style.transitionDuration='.42s';
      this.render(); this.state('perk');
      if (Math.random()<.6) this.bleat(pick(['maaa!','look!','meh~']));
      this.timer=setTimeout(()=>{
        this.state('chewing');
        this.timer=setTimeout(()=>{
          this.lift=0; this.el.style.transitionDuration='.36s'; this.render();
          this.timer=setTimeout(()=>this.think(), 520);
        }, rnd(3500,7000));
      }, 1300);
    });
  }
  think(){
    this.clear();
    if (FW<80){ this.timer=setTimeout(()=>this.think(), 250); return; }
    if (this.x < 4 && this.y < 4){                    // recover from a bad first layout
      this.y = atDepth(this.fd || .5);
      this.x = this.clampX((this.fx || .5)*FW, this.y);
      this.render(true);
    }
    if (WEATHER === 'rain'){ return this.seekShelter(); }
    if (nightFactor > .6 && Math.random() < .7){        // sleepy after dark
      const s = spot(this.x < FW*.55 ? 'shelterA' : 'shelterB');
      return this.walkTo(s.x+rnd(-56,56), s.y-rnd(2,18),
        ()=>this.hold('chewing', rnd(10,22), ()=>this.think()));
    }

    if (this.opts.follows){                    // the kid stays near its mother
      const m=this.opts.follows; m.syncFromDOM();
      if (Math.hypot(m.x-this.x, m.y-this.y) > FW*0.24 || Math.random()<.32){
        return this.walkTo(m.x+rnd(-70,70), m.y+rnd(-14,14), ()=>{
          if (Math.random()<.45){ this.el.classList.add('happy');
            setTimeout(()=>this.el.classList.remove('happy'),600); }
          this.timer=setTimeout(()=>this.think(), rnd(700,1800));
        });
      }
    }

    const r=Math.random();
    if (r<.20){                                 // nibble at the hay rack
      const f=spot('feeder');
      this.walkTo(f.x+rnd(-46,46), f.y-rnd(10,26),
        ()=>this.hold('feeding', rnd(4,9), ()=>this.think()));
    } else if (r<.40){
      this.hold('grazing', rnd(4,9), ()=>this.think());
    } else if (r<.52){
      if (Math.random()<.3) this.bleat(pick(['maaa','meh~','baa?','mmm…']));
      this.hold('chewing', rnd(2.5,5), ()=>this.think());
    } else if (r<.60){                          // a drink
      const t=spot('trough');
      this.walkTo(t.x+rnd(16,50), t.y, ()=>this.hold('drinking', rnd(3,4.5), ()=>this.think()));
    } else if (r<.70 && !this.opts.follows){    // climb the platform
      this.climb();
    } else if (r<.80){                          // loiter by a shelter
      const s=spot(Math.random()<.5?'shelterA':'shelterB');
      this.walkTo(s.x+rnd(-70,70), s.y-rnd(6,24),
        ()=>this.hold('chewing', rnd(4,9), ()=>this.think()));
    } else {
      this.walkTo(rnd(FW*0.14, FW*0.86), rnd(yNear+6, yFar-6),
        ()=>this.hold('grazing', rnd(3,7), ()=>this.think()));
    }
  }
}

const GW = Math.max(140, Math.min(196, (field.clientWidth||innerWidth)*0.44));
const pip = new Goat('p', COATS.pip, {name:'Pip', fx:.52, fd:.40, width:GW, speed:42,
  horn:'ibex', pitch:.8});
const nutmeg = new Goat('n', COATS.nutmeg, {name:'Nutmeg', fx:.34, fd:.30, width:GW, sizeMul:.6,
  speed:64, horn:'nub', beard:false, pitch:1.6, follows:pip});
const clover = new Goat('c', COATS.clover, {name:'Clover', fx:.74, fd:.62, width:GW, sizeMul:.86,
  speed:48, horn:'curl', saddle:true, pitch:1.05});
const HERD = [pip, nutmeg, clover];

/* ============ interaction ============ */
/* tapping the grass: only the nearest one ambles over, at its own pace */
field.addEventListener('pointerdown', e=>{
  const f=field.getBoundingClientRect();
  const x=e.clientX-f.left, y=f.bottom-e.clientY;
  if (y>yFar+24 || WEATHER==='rain') return;
  floatAt(e.clientX, e.clientY, '🌱');
  let best=null, bd=1e9;
  HERD.forEach(g=>{ g.syncFromDOM();
    const d=Math.hypot(g.x-x,(g.y-y)*.8); if (d<bd){ bd=d; best=g; } });
  if (!best || bd < 24) return;
  say(`${best.name} wanders over…`);
  best.goEat(x, Math.max(y, yNear + (yFar-yNear)*0.12), rnd(5,9));  // never right up in your face
});

document.getElementById('btnHay').onclick=()=>{
  const f=spot('feeder');
  const x=f.x+rnd(-60,60), y=f.y-rnd(20,50), s=scaleAt(y);
  const h=document.createElement('div');
  h.className='hay';
  h.innerHTML=`<svg width="80" height="44" viewBox="0 0 80 44">
    <ellipse cx="40" cy="38" rx="36" ry="6" fill="#c9a44e"/>
    <path d="M8 38 q10 -28 32 -32 q23 -4 32 32z" fill="#e3c268"/>
    <g stroke="#b9963f" stroke-width="2" stroke-linecap="round">
      <path d="M20 36 q4 -14 12 -21"/><path d="M35 37 q1 -17 5 -25"/>
      <path d="M50 36 q-1 -16 -5 -23"/><path d="M61 36 q-4 -13 -10 -19"/></g></svg>`;
  const t=`translate(${x}px, ${-y}px) translateX(-50%) scale(${s})`;
  h.style.setProperty('--t',t); h.style.transform=t; h.style.zIndex=Math.round(900-y);
  field.appendChild(h);
  say('Fresh hay in the rack! 🌾');
  HERD.forEach((g,i)=> setTimeout(()=>g.goEat(x,y,8-i), i*350));
  setTimeout(()=>{ h.style.transition='opacity .8s'; h.style.opacity='0';
    setTimeout(()=>h.remove(),800); }, 12000);
  addLove();
};

document.getElementById('btnWater').onclick=()=>{
  say('Off to the trough. 💧');
  const t=spot('trough');
  HERD.forEach((g,i)=>{
    g.clear();
    setTimeout(()=>g.walkTo(t.x+rnd(16,52)+i*14, t.y-i*6,
      ()=>g.hold('drinking', rnd(3,5), ()=>g.think())), i*420);
  });
  addLove();
};

/* they answer from wherever they are — no stampede to the middle */
document.getElementById('btnCall').onclick=()=>{
  say('They lift their heads and answer. 🐐');
  HERD.forEach((g,i)=>{
    setTimeout(()=>{
      g.clear(); g.state('perk');
      g.bleat(pick(['maaa~','meh!','baa~','mmmeh']));
      g.timer=setTimeout(()=>{
        g.hold(Math.random()<.5?'grazing':'chewing', rnd(4,9), ()=>g.think());
      }, 2200);
    }, i*rnd(500,900));
  });
  addLove();
};

/* ============ layout ============ */
let lastW=0, lastH=0;
function relayout(force){
  const prevW=FW, prevH=FH;
  measure();
  if (FW<80) return;
  // a phone hiding/showing its address bar fires resize constantly — never
  // let that yank the animals to a new spot mid-stroll
  if (force !== true && FW===lastW && Math.abs(FH-lastH) < FH*0.22){
    if (FH !== lastH){ lastH=FH; layoutProps(); }
    return;
  }
  lastW=FW; lastH=FH;
  layoutProps();
  const lo=document.getElementById('trunkLo');
  if (lo){
    const s=scaleAt(atDepth(SPOTS.tree.fd));
    lo.style.width=Math.round(30*s)+'px';
    lo.style.bottom=Math.round(atDepth(SPOTS.tree.fd))+'px';
    lo.style.height=Math.round(FH-atDepth(SPOTS.tree.fd)+8)+'px';
    lo.style.zIndex=Math.round(900-atDepth(SPOTS.tree.fd));
  }
  const bt=document.querySelector('.trunk-hi');
  if (bt) bt.style.width=Math.round(30*scaleAt(atDepth(SPOTS.tree.fd)))+'px';
  HERD.forEach(g=>{
    g.clear();
    const ox=g.x, oy=g.y;
    g.y=Math.max(yNear, Math.min(yFar, atDepth(g.fd)));
    g.x=g.clampX(g.fx*FW, g.y);
    if (Math.hypot(g.x-ox, g.y-oy) > 8){       // never blink to a new spot — hop there
      g.el.style.transitionTimingFunction='cubic-bezier(.32,1.3,.5,1)';
      g.el.style.transitionProperty='transform';
      g.el.style.transitionDuration='.5s';
      g.render();
      g.el.classList.add('happy');
      setTimeout(()=>g.el.classList.remove('happy'), 600);
    } else g.render(true);
    g.think();
  });
}
addEventListener('resize', ()=>relayout(false));
addEventListener('load', ()=>relayout(true));
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  relayout(true);
  updateSky();
  setInterval(updateSky, 60000);
  say(greeting());
  setTimeout(weatherTick, rnd(60000, 130000));
}));
</script>
