      title = {Teacher Professional Development on WhatsApp and LLMs: Early Lessons from Cameroon},
      author = {Cannanure, Vikram Kamath and Yinkfu, Bruno and Bryan, Douglas and Amin, Mati and Weber, Ingmar},
      booktitle = {Artificial Intelligence in Education (AIED 2026)},
      series = {Communications in Computer and Information Science},
      pages = {249--261},
