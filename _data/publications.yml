  kind: "journal"
  title: "Exploring AI in Education: Child-Computer Interaction in the Global South"
  authors: "Riti Verma, Ingmar Weber, and Vikram Kamath Cannanure"
  authors_list:
    - "Riti Verma"
    - "Ingmar Weber"
    - "Vikram Kamath Cannanure"
  venue: "ACM Journal on Computing and Sustainable Societies, 3(3), Article 20, 1-23"
  doi: "10.1145/3736645"
  url: "https://doi.org/10.1145/3736645"
  pdf: "/assets/papers/ai-education-child-computer-interaction-global-south.pdf"
  tag: "Global South"
  keywords:
    - "Global South"
    - "Children"
    - "AI in Education"
  abstract: >-
    Recent artificial intelligence advancements promise to enhance children’s education through well-planned interventions. However, designing AI interventions for the Global South is challenging due to limited literature on children’s interactions with AI-based educational tools. This survey paper identified 18 studies from 2014 to 2025 that explicitly focus on child-computer interaction when integrating AI into education in the Global South. Our synthesized review uncovers three primary themes: enhancing learning through AI-driven tools, addressing barriers like privacy concerns and digital literacy gaps, and designing strategies for effective AI implementation. Key insights reveal AI’s potential to enrich children’s learning through personalized experiences, voice assistants, and educational games. Yet, challenges such as limited technology access, privacy risks, and cultural barriers require targeted solutions to ensure AI benefits all students. We conclude by proposing design strategies for AI integration that involve co-designing with children, enhancing digital literacy, and creating child-friendly interfaces.
