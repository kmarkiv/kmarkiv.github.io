  date: "2026-04-09"
  kind: "journal"
  title: "Impacts of Targeted Instruction with Mobile-Based Support on Teachers and Students in Rural Côte d’Ivoire"
  authors: "Sharon Wolf, Amy Ogan, Kaja K. Jasińska, Samuel Kembou, Vikram Kamath Cannanure, Hannah Whitehead, Julianna Corbett, Fabrice Tanoh, Brooke Wortsman, Joshua Lim, Hui Zhao, and Anahita Kumar"
  authors_list:
    - "Sharon Wolf"
    - "Amy Ogan"
    - "Kaja K. Jasińska"
    - "Samuel Kembou"
    - "Vikram Kamath Cannanure"
    - "Hannah Whitehead"
    - "Julianna Corbett"
    - "Fabrice Tanoh"
    - "Brooke Wortsman"
    - "Joshua Lim"
    - "Hui Zhao"
    - "Anahita Kumar"
  venue: "American Educational Research Journal"
  doi: "10.3102/00028312261430679"
  url: "https://doi.org/10.3102/00028312261430679"
  pdf: "/assets/papers/targeted-instruction-mobile-support-cote-divoire.pdf"
  tag: "Teacher Learning"
  keywords:
    - "Teacher Learning"
    - "Randomised Trial"
    - "Côte d'Ivoire"
  abstract: >-
    We report results from a school-randomized trial examining a targeted instruction program (Teaching at the Right Level) in Côte d’Ivoire implemented by teachers (N = 167 schools, 303 teachers, and 3,808 students). The program modestly improved literacy and numeracy learning levels (d_w = .13, q = .013 and .27, q = .001) but had no statistically significant impacts on functional literacy and numeracy (d_w = .08, q < .096 for both). After two years, 63% and 21% of children scored at the two lowest levels of literacy and numeracy, respectively. Learning gains were concentrated among children at the bottom of the distribution. Quantitative and qualitative data highlighted the importance of distinguishing between fluency and decoding or computational skills, teacher program knowledge, and barriers to and enablers of quality implementation.
