  kind: "conference"
  title: "Exploring LLMs for Automated Generation and Adaptation of Questionnaires"
  authors: "Divya Mani Adhikari, Alexander Hartland, Ingmar Weber, and Vikram Kamath Cannanure"
  authors_list:
    - "Divya Mani Adhikari"
    - "Alexander Hartland"
    - "Ingmar Weber"
