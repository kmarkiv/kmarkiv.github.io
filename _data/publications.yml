- year: 2024
  slug: "scaling-teacher-mentorship-mobile-technology"
  date: "2024-07-15"
  kind: "conference"
  title: "“I Believe I Did Not Preach into the Desert”: Opportunities and Challenges in Scaling Teacher Mentorship through Mobile Technology in Rural Côte d’Ivoire"
  authors: "Tricia J. Ngoon, Vikram Kamath Cannanure, Kaja Jasińska, Sharon Wolf, and Amy Ogan"
  authors_list:
    - "Tricia J. Ngoon"
    - "Vikram Kamath Cannanure"
    - "Kaja Jasińska"
    - "Sharon Wolf"
    - "Amy Ogan"
  venue: "Proceedings of the Eleventh ACM Conference on Learning @ Scale (L@S), 232-242"
  doi: "10.1145/3657604.3662035"
  url: "https://doi.org/10.1145/3657604.3662035"
  pdf: "/assets/papers/scaling-teacher-mentorship-mobile-technology.pdf"
  tag: "Teacher Learning"
  keywords:
    - "Teacher Learning"
    - "Mentorship"
    - "Mobile Technology"
  abstract: >-
    Mentoring is crucial for teachers’ professional development, but challenges of access, resources, and capacity make regular in-person mentorship difficult in low-infrastructure contexts. Mobile technologies such as social media have the potential to scale teacher professional development and communities. This paper explores the culture of teacher mentorship in rural Côte d’Ivoire and the motivations and challenges mentors face in using mobile technology in their work through semi-structured interviews with 33 teacher mentors. We found that mentors valued social connections and knowledge sharing in using mobile technology. However, power dynamics between teachers and mentors affected how they could collaborate. Mentors also expressed frustrations with the lack of moderation within social media groups. Lack of infrastructure and connectivity also raise potential issues of inclusion and access to rural areas and schools. We conclude with design recommendations for technologies that scale culturally relevant teaching mentorship in low-infrastructure contexts.
