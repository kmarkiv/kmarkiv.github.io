- year: 2020
  slug: "dia-human-ai-hybrid-conversational-assistant"
  date: "2020-06-17"
  kind: "conference"
  title: "DIA: A Human AI Hybrid Conversational Assistant for Developing Contexts"
  authors: "Vikram Kamath Cannanure, Timothy X. Brown, and Amy Ogan"
  authors_list:
    - "Vikram Kamath Cannanure"
    - "Timothy X. Brown"
    - "Amy Ogan"
  venue: "Proceedings of the 2020 International Conference on Information and Communication Technologies and Development (ICTD), Article 24, 1-5"
  doi: "10.1145/3392561.3397577"
  url: "https://doi.org/10.1145/3392561.3397577"
  pdf: "/assets/papers/dia-human-ai-hybrid-conversational-assistant.pdf"
  tag: "Conversational AI"
  keywords:
    - "Conversational AI"
    - "Chatbots"
    - "WhatsApp"
  abstract: >-
    Social media messaging applications such as WhatsApp and Facebook Messenger reached 2.3 billion users in 2019, with the majority of users emerging from developing countries. This high usage opens possibilities for designing text-based interventions for social change, but such interventions rely on expert knowledge that is scarce in developing contexts. Expert knowledge can be scaled using chatbots, yet more research is needed to support users who need context-specific support, local-language interventions, or who may not have regular internet connectivity. To support the design of chatbot-based interventions in low-resource contexts, we built DIA, a chatbot architecture that scales expert knowledge and supports localization. DIA is a human-chatbot hybrid system that organically learns topic-specific knowledge and local language from user interactions. We built a preliminary version on WhatsApp and deployed it to mentor 38 teachers in rural Côte d’Ivoire. The deployment shows that DIA can help build datasets of topic- and language-specific dialogues, reveal users’ online smartphone usage through chat logs, and collect survey data through conversational interaction.
