- year: 2022
  slug: "teacher-aspirations-rural-cote-divoire-2022"
  date: "2022-06-29"
  kind: "conference"
  title: "“We dream of climbing the ladder; to get there, we have to do our job better”: Designing for Teacher Aspirations in rural Côte d’Ivoire"
  authors: "Vikram Kamath Cannanure, Eloísa Ávila-Uribe, Tricia Ngoon, Yves Thierry Adji, Sharon Wolf, Kaja Jasińska, Timothy X. Brown, and Amy Ogan"
  authors_list:
    - "Vikram Kamath Cannanure"
    - "Eloísa Ávila-Uribe"
    - "Tricia Ngoon"
    - "Yves Thierry Adji"
    - "Sharon Wolf"
    - "Kaja Jasińska"
    - "Timothy X. Brown"
    - "Amy Ogan"
  venue: "ACM SIGCAS/SIGCHI Conference on Computing and Sustainable Societies (COMPASS), 122-138"
  doi: "10.1145/3530190.3534794"
  url: "https://doi.org/10.1145/3530190.3534794"
  preprint: "https://tngoon.github.io/docs/pubs/Cannanure_etal_2022_COMPASS.pdf"
  pdf: "/assets/papers/teacher-aspirations-rural-cote-divoire-2022.pdf"
  tag: "Teacher Learning"
  keywords:
    - "Teacher Learning"
    - "Teacher Aspirations"
    - "Scaling"
  abstract: >-
    As governments in developing countries race to solve the global learning crisis, a key focus is on novel teaching approaches taught in pedagogical programs. To scale, these programs rely on government teacher training infrastructure. However, they face challenges in rural parts of Africa where there is a lack of advisor support, teachers are isolated, and technology infrastructure is still emerging. Conversational agents have addressed some of these challenges by scaling expert knowledge and providing personalized interactions, but it is unclear how this work can translate to rural African contexts. To explore the use of such technology in this design space, we conducted two related studies. The first was a qualitative study with 20 teachers and ministry officials in rural Côte d’Ivoire to understand opportunities and challenges in technology use for these stakeholders. Second, we shared a conversational agent probe over WhatsApp with 38 teachers for 14 weeks to uncover realistic use cases. We examined our findings through a theoretical lens of aspirations to discover sustainable design directions for conversational agents that support teachers in low-infrastructure settings.
  bibtex: |
