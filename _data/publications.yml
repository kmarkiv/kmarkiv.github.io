- year: 2026
  slug: "teacher-development-whatsapp-llms-cameroon"
  date: "2026-06-27"
  kind: "conference"
  title: "Teacher Professional Development on WhatsApp and LLMs: Early Lessons from Cameroon"
  authors: "Vikram Kamath Cannanure, Bruno Yinkfu, Douglas Bryan, Mati Amin, and Ingmar Weber"
  authors_list:
    - "Vikram Kamath Cannanure"
    - "Bruno Yinkfu"
    - "Douglas Bryan"
    - "Mati Amin"
    - "Ingmar Weber"
  venue: "Artificial Intelligence in Education (AIED 2026), Communications in Computer and Information Science, 249-261"
  doi: "10.1007/978-3-032-29791-4_18"
  url: "https://doi.org/10.1007/978-3-032-29791-4_18"
  preprint: "https://arxiv.org/abs/2604.04139"
  pdf: "/assets/papers/teacher-development-whatsapp-llms-cameroon.pdf"
  tag: "Conversational AI"
  keywords:
    - "Conversational AI"
    - "WhatsApp"
    - "Teacher Training"
  abstract: >-
    AI in education is commonly delivered through web-based systems such as online forms and institutional platforms. However, these approaches can exclude teachers in low-resource contexts, where everyday mobile platforms like WhatsApp serve as primary digital infrastructure. To address this gap, we present a field pilot in Cameroon that deploys a WhatsApp-based chatbot with LLM-supported content for teacher professional development, compared with an online form baseline. The system was evaluated through a mixed-methods study with 47 primary school teachers, integrating quantitative measures with qualitative insights from interviews and participant feedback. Results show that the chatbot was rated higher in perceived usability and overall experience, while learnability remained comparable. These improvements were driven by platform familiarity, low interaction overhead, and the modular structure of LLM-supported content, but were constrained by connectivity limitations, prepaid data costs, and multilingual needs. Building on these findings, we outline design directions for multilingual, culturally grounded interaction and for supporting prompting and reflection in AI use. More broadly, this work points to Thoughtful AI that supports reflection, relevance, and sustained professional growth.
