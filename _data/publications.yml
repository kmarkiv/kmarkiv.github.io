  date: "2025-11-24"
  kind: "journal"
  title: "A Design-Based Research Approach to Bridge Teacher Aspirations and Goal-Setting"
  authors: "Vikram Kamath Cannanure, Tricia J. Ngoon, Sharon Wolf, Kaja K. Jasińska, Tim Brown, and Amy Ogan"
  authors_list:
    - "Vikram Kamath Cannanure"
