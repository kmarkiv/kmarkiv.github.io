      title = {{``We dream of climbing the ladder; to get there, we have to do our job better''}: Designing for Teacher Aspirations in rural C{\^o}te d'Ivoire},
      author = {Cannanure, Vikram Kamath and {\'A}vila-Uribe, Elo{\'i}sa and Ngoon, Tricia and Adji, Yves Thierry and Wolf, Sharon and Jasi{\'n}ska, Kaja and Brown, Timothy X. and Ogan, Amy},
