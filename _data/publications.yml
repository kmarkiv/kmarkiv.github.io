- year: 2024
  slug: "longitudinal-chatbot-community-of-practice"
  date: "2024-09-16"
  kind: "journal"
  title: "Understanding the Longitudinal Impact of a Chatbot to Facilitate a Virtual Community of Practice for Teachers in Rural Côte d’Ivoire"
  authors: "Vikram Kamath Cannanure, Tricia Ngoon, Sharon Wolf, Kaja Jasińska, Timothy X. Brown, and Amy Ogan"
  authors_list:
    - "Vikram Kamath Cannanure"
    - "Tricia Ngoon"
    - "Sharon Wolf"
    - "Kaja Jasińska"
    - "Timothy X. Brown"
    - "Amy Ogan"
  venue: "ACM Journal on Computing and Sustainable Societies, 2(3), Article 37, 1-37"
  doi: "10.1145/3675762"
  url: "https://doi.org/10.1145/3675762"
  pdf: "/assets/papers/longitudinal-chatbot-community-of-practice.pdf"
  tag: "Conversational AI"
  keywords:
    - "Conversational AI"
    - "Chatbots"
    - "Community of Practice"
  abstract: >-
    Communities of practice can improve teachers’ professional development through informal in-person discussions among community members. However, infrastructural challenges pose difficulties in fostering in-person connections, particularly in rural communities in the Global South. The emergence of social media and chatbots has presented an avenue for creating virtual communities for teachers, especially those in rural areas. An unanswered question is the potential impact of a chatbot-supported virtual teacher community on teachers’ professional development. To answer this question, we conducted a longitudinal quasi-experiment involving 313 teachers participating in a new training program in rural Côte d’Ivoire by deploying a chatbot on Facebook Messenger. Our experiment had two chatbot versions for two regions: one version supporting a virtual community and one control. Our findings indicate that teachers in the virtual community condition exhibited modest enhancements in motivation and knowledge indicators. We make a case for implementing virtual communities of practice facilitated by chatbots to bolster the professional development of teachers in rural African contexts.
